<title>Clavis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F4F2; --surface:#FBFBFA; --surface-2:#EEEEEB; --ink:#2A2C31; --ink-2:#6B6E75; --ink-3:#9C9EA5;
  --line:#E6E6E2; --line-2:#EFEFEC; --accent:#4A5578; --accent-ink:#3D4763; --accent-soft:#E7E9F0;
  --ochre:#96712F; --ochre-soft:#F0EADC; --moss:#4C7057; --moss-soft:#E4EBE5; --rust:#9A5648; --rust-soft:#F0E2DE;
  --unk:#F4ECD6; --unk-line:#96712F; --fluid:#2A2C31; --fluid-hi:rgba(255,255,255,.30); --pool:rgba(74,85,120,.07);
  --cosmos-ground:#EAEAE6; --cosmos-grey:#D2D2CC; --cosmos-label:#54565C; --cosmos-labelbg:rgba(251,251,250,.72);
  --cosmos-ring:#54565C; --cosmos-crest:#7E8089; --cosmos-dustlite:#CFCFC8;
  --rel-bor:#B08A3E; --rel-kin:#7C88B5;
  --hud-bg:rgba(251,251,250,.82); --hud-ink:#54565C; --hud-on-bg:#2A2C31; --hud-on-ink:#F4F4F2;
  --orb-ink:#2A2C31;
  --btn-primary:#2A2C31; --btn-primary-ink:#F7F7F5;
  --shadow:0 1px 2px rgba(38,40,46,.03),0 12px 32px -20px rgba(38,40,46,.16);
  --dock-bg:rgba(251,251,250,.9);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --paper:#15161A; --surface:#1B1C21; --surface-2:#222328; --ink:#DCDDE1; --ink-2:#9B9DA5; --ink-3:#6E7077;
  --line:#26272D; --line-2:#202126; --accent:#9AA5C8; --accent-ink:#B3BDDA; --accent-soft:#262A38;
  --ochre:#C3A469; --ochre-soft:#2C2820; --moss:#8FAE97; --moss-soft:#20261F; --rust:#C08A7D; --rust-soft:#2C211E;
  --unk:#2C2820; --unk-line:#C3A469; --fluid:#0C0D11; --fluid-hi:rgba(190,200,235,.22); --pool:rgba(154,165,200,.07);
  --cosmos-ground:#1B1C21; --cosmos-grey:#34353C; --cosmos-label:#B6B8BF; --cosmos-labelbg:rgba(21,22,26,.66);
  --cosmos-ring:#C9CBD2; --cosmos-crest:#EDEEF2; --cosmos-dustlite:#4A4B52;
  --rel-bor:#C9A96A; --rel-kin:#98A3C6;
  --hud-bg:rgba(27,28,33,.78); --hud-ink:#B6B8BF; --hud-on-bg:#DCDDE1; --hud-on-ink:#1B1C21;
  --orb-ink:#DCDDE1;
  --btn-primary:#D7D8DC; --btn-primary-ink:#1B1C21;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 32px -20px rgba(0,0,0,.5);
  --dock-bg:rgba(27,28,33,.9);
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15161A; --surface:#1B1C21; --surface-2:#222328; --ink:#DCDDE1; --ink-2:#9B9DA5; --ink-3:#6E7077;
  --line:#26272D; --line-2:#202126; --accent:#9AA5C8; --accent-ink:#B3BDDA; --accent-soft:#262A38;
  --ochre:#C3A469; --ochre-soft:#2C2820; --moss:#8FAE97; --moss-soft:#20261F; --rust:#C08A7D; --rust-soft:#2C211E;
  --unk:#2C2820; --unk-line:#C3A469; --fluid:#0C0D11; --fluid-hi:rgba(190,200,235,.22); --pool:rgba(154,165,200,.07);
  --cosmos-ground:#1B1C21; --cosmos-grey:#34353C; --cosmos-label:#B6B8BF; --cosmos-labelbg:rgba(21,22,26,.66);
  --cosmos-ring:#C9CBD2; --cosmos-crest:#EDEEF2; --cosmos-dustlite:#4A4B52;
  --rel-bor:#C9A96A; --rel-kin:#98A3C6;
  --hud-bg:rgba(27,28,33,.78); --hud-ink:#B6B8BF; --hud-on-bg:#DCDDE1; --hud-on-ink:#1B1C21;
  --orb-ink:#DCDDE1;
  --btn-primary:#D7D8DC; --btn-primary-ink:#1B1C21;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 32px -20px rgba(0,0,0,.5);
  --dock-bg:rgba(27,28,33,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind',"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:600px;margin:0 auto;padding:0 14px 130px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:1.6rem;line-height:1.15}
h3{font-size:1.05rem;font-weight:600}
p{margin:0 0 .8rem}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s ease,border-color .15s ease,background .12s ease;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.97);background:var(--surface-2)}
input,select,textarea{touch-action:manipulation}
button:hover{border-color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--btn-primary);color:var(--btn-primary-ink);border-color:var(--btn-primary);font-weight:600}
button.quiet{box-shadow:none;background:transparent;border-color:transparent;color:var(--ink-2);padding:6px 8px}
button:disabled{opacity:.5;cursor:default}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.small{font-size:.88rem;color:var(--ink-2)}
.topbar{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 6px;gap:10px}
.wordmark{font-family:'Rozha One',Georgia,serif;font-size:1.4rem;line-height:1}
.viewname{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.chip.prod{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.rec{background:var(--moss-soft);color:var(--moss);border-color:transparent}
.chip.warn{background:var(--ochre-soft);color:var(--ochre);border-color:transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:baseline}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0}
.stat div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}

/* ---------- the pool + orb (ferrofluid) ---------- */
.pool{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.orbwrap{position:relative;width:min(72vw,290px);aspect-ratio:1;border-radius:50%;cursor:pointer}
.orbwrap::before{content:"";position:absolute;inset:-9%;border-radius:50%;background:radial-gradient(circle at 50% 42%, var(--pool), transparent 70%)}
.orbwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.orblabel{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:var(--orb-ink)}
.orblabel b{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:1.35rem;letter-spacing:.02em}
.orblabel span{font-size:.8rem;opacity:.85}
.poolcap{margin:10px 0 0;font-size:.88rem;color:var(--ink-2);text-align:center;max-width:34ch}

/* ---------- scene ---------- */
.scene{position:relative;width:100%;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);background-repeat:no-repeat}
.scene.full{aspect-ratio:auto}
.scene img{display:block;width:100%;height:auto}
.vignette{position:absolute;inset:0;pointer-events:none}
.bmark{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.bmark i{display:block;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px rgba(22,24,30,.6),0 2px 10px rgba(0,0,0,.45)}
.bmark::after{content:"";position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:bpulse 2.4s ease-out infinite}
.bmark.mini i{width:7px;height:7px;box-shadow:0 0 0 2px rgba(22,24,30,.55)}
.bmark.mini::after{display:none}
@keyframes bpulse{0%{transform:scale(.45);opacity:.85}70%{opacity:.12}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.bmark::after{animation:none;opacity:.32;transform:scale(1)}}
.bmark.num i{width:19px;height:19px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#20242C;font-style:normal}
.bmark.num::after{display:none}
.capnum{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;color:var(--ink-2);margin-top:14px}
.caprow{border-radius:10px;transition:background .3s ease}
.caprow.lit{background:var(--accent-soft)}
.bring{position:absolute;border:2px solid rgba(255,255,255,.92);border-radius:10px;box-shadow:0 0 0 2px rgba(22,24,30,.4);pointer-events:none;z-index:2}
.btext{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;color:#20242C;font-weight:600;line-height:1.25;text-shadow:0 0 4px #fff,0 0 8px #fff,0 0 12px #fff;overflow:hidden;padding:1px}
.btext.page{line-height:1.2;text-shadow:0 0 2px #fff,0 0 5px #fff;font-weight:600}
/* Some episodes draw their balloons in the text layer, so the art alone has none.
   A blurred white plate is invisible on a drawn balloon and becomes one where there isn't. */
.bplate{position:absolute;pointer-events:none;background:rgba(255,255,255,.9);border-radius:44%/50%;filter:blur(5px)}
.btext.tap{pointer-events:auto;cursor:pointer;border-radius:6px}
.btext.tap:active{background:rgba(255,255,255,.5)}
.bhalo{position:absolute;pointer-events:none;z-index:2;border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 4px rgba(24,26,32,.35),0 0 22px 8px rgba(255,255,255,.3);animation:bhalo 2.8s ease-in-out infinite}
@keyframes bhalo{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bhalo{animation:none;opacity:.85}}
.pagenum{position:absolute;transform:translate(-62%,-62%);z-index:3;width:13px;height:13px;border-radius:50%;background:rgba(22,24,30,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;pointer-events:none}
.pagegloss{background:var(--surface-2);border-radius:10px;padding:9px 12px;margin:8px 0 0;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.pagegloss .tx{flex:1}
.pagegloss .en{display:block;color:var(--ink-2);font-size:.85rem;margin-top:2px}
.caption{font-size:1.3rem;line-height:1.9;margin:14px 0 6px}
.caption[dir="rtl"]{text-align:right;font-size:1.45rem}
.caption.cjk{font-size:1.45rem}
.tok{display:inline-block;vertical-align:top;text-align:center;padding:0 2px;border-radius:6px;border-bottom:2px solid transparent;cursor:pointer;margin:0 1px}
.tok .t-r{display:block;font-size:.62em;line-height:1.1;color:var(--ink-3);font-weight:400;letter-spacing:.02em;margin-top:-2px}
.tok.unk{background:var(--unk);border-bottom-color:var(--unk-line)}
.tok.known{border-bottom-color:var(--moss)}
.tok.gap{background:var(--accent-soft);color:var(--accent-ink);padding:0 8px;font-weight:600}
.tok.hit{background:var(--moss-soft);border-bottom-color:var(--moss)}
.tok.miss{background:var(--rust-soft);border-bottom-color:var(--rust)}
.speak{border:0;box-shadow:none;background:var(--surface-2);border-radius:50%;width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.choices{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.choices button{font-size:1.15rem;text-align:left;padding:12px 14px}
.choices button .t-r{display:block;font-size:.72rem;color:var(--ink-3);font-weight:400}
.choices button.right{background:var(--moss-soft);border-color:var(--moss)}
.choices button.wrong{background:var(--rust-soft);border-color:var(--rust)}
.parallel{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:1rem}
.parallel .l{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:8px}
.parallel div{margin:4px 0}
.bridge{font-size:.95rem;color:var(--ink-2);margin:6px 0}
.bridge b{color:var(--ink)}
.hint{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.9rem;box-shadow:var(--shadow);max-width:90vw;pointer-events:none}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px}
.progressbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:6px 0}
.progressbar i{display:block;height:100%;background:var(--accent)}
.lane{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.lane:last-child{border-bottom:0}
.lane .name{font-weight:600}
.lane .meta{font-size:.82rem;color:var(--ink-2);grid-column:1/-1}
.lane .why{font-size:.82rem;color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;box-shadow:none;padding:6px 10px;font-size:.8rem;background:transparent}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}
.testword{font-size:2.2rem;text-align:center;padding:26px 10px 4px;font-family:'Rozha One',Georgia,serif}
.testword.plain{font-family:inherit;font-weight:600}
.testread{text-align:center;color:var(--ink-3);font-size:1rem;min-height:1.4em;margin-bottom:14px}
textarea{width:100%;min-height:120px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.8rem;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.toast{position:fixed;left:50%;bottom:116px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.sessionbar{display:flex;gap:4px;margin:6px 0 10px}
.sessionbar i{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.sessionbar i.done{background:var(--accent)}
.sessionbar i.now{background:var(--ochre)}
.loading{padding:60px 0;text-align:center;color:var(--ink-2)}
.coach{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.92rem;color:var(--accent-ink);margin:10px 0}

/* ---------- onboarding ---------- */
.ob{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;align-items:center;padding:10px 0}
.ob h2{font-size:clamp(1.7rem,6vw,2.2rem)}
.ob p{max-width:38ch;color:var(--ink-2)}
.ob .glyphs{font-size:2rem;line-height:1.3;letter-spacing:.06em;margin-bottom:6px;filter:saturate(.9)}
.obdots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.obdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.obdots i.on{background:var(--accent)}

/* ---------- letters ---------- */
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.kana-grid.k3{grid-template-columns:repeat(3,1fr)}
.kana{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;text-align:center;padding:9px 2px 6px;cursor:pointer;transition:transform .08s ease}
.kana:active{transform:scale(.94)}
.kana b{display:block;font-size:1.45rem;font-weight:500;line-height:1.2}
.kana span{display:block;font-size:.68rem;color:var(--ink-3);letter-spacing:.03em}
.kana.wide b{font-size:1.2rem}
.scripttabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.scripttabs button{padding:7px 12px;font-size:.9rem}
.scripttabs button.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}

/* ---------- bottom bar (minimal) ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;pointer-events:none}
.bar-inner{pointer-events:auto;display:flex;gap:2px;margin:0 10px calc(12px + env(safe-area-inset-bottom,0px));padding:6px;background:var(--dock-bg);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.bar button{border:0;box-shadow:none;background:transparent;border-radius:11px;padding:8px 12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);min-width:58px;min-height:48px}
.bar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar button .g{font-size:1.05rem;line-height:1.2;font-weight:500}
.bar button span.lbl{font-size:.62rem;letter-spacing:.04em}
.bar button.on{background:var(--accent-soft);color:var(--accent-ink)}
.gear{border:0;box-shadow:none;background:transparent;padding:6px;color:var(--ink-3)}
.gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- citations ---------- */
sup.cite{font-size:.68em;line-height:0}
sup.cite a{color:var(--accent-ink);text-decoration:none;padding:0 1px;cursor:pointer}
.ref{padding:8px 0;border-bottom:1px solid var(--line-2);font-size:.9rem}
.ref:last-child{border-bottom:0}
.ref b{font-weight:600}
.ref .small{display:block}
.claim{margin:14px 0 4px;font-weight:600}

/* ---------- cosmos ---------- */
/* the ground is a tone away from the page and dissolves into it — no box, no border */
.cosmos-wrap{position:relative;margin:10px 0;background:radial-gradient(ellipse 78% 64% at 50% 44%, var(--cosmos-ground) 30%, var(--paper) 100%)}
.grainy::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.26;-webkit-mask-image:radial-gradient(ellipse 72% 60% at 50% 45%, #000 35%, transparent 95%);mask-image:radial-gradient(ellipse 72% 60% at 50% 45%, #000 35%, transparent 95%);background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMjAnIGhlaWdodD0nMjIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHR5cGU9J21hdHJpeCcgdmFsdWVzPScwIDAgMCAwIDAuNSAwIDAgMCAwIDAuNSAwIDAgMCAwIDAuNSAwIDAgMCAwLjU1IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMjIwJyBoZWlnaHQ9JzIyMCcgZmlsdGVyPSd1cmwoI24pJy8+PC9zdmc+");background-size:220px 220px}
.cosmos-wrap canvas{display:block;width:100%;touch-action:none;cursor:grab}
.cosmos-wrap canvas:active{cursor:grabbing}
.cosmos-tools{position:absolute;left:10px;right:10px;bottom:26px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;pointer-events:none;z-index:2}

<script>
// ============================================================ constants
const LANGS = {
  es:{n:'Spanish', c:'romance', sib:['fr','it'], t:'latin', col:'#B3543B'},
  fr:{n:'French',  c:'romance', sib:['es','it'], t:'latin', col:'#7A5CC0'},
  it:{n:'Italian', c:'romance', sib:['es','fr'], t:'latin', col:'#3E8D5C'},
  de:{n:'German',  c:'germanic', sib:['nl'], t:'latin', col:'#4E6B8A'},
  nl:{n:'Dutch',   c:'germanic', sib:['de'], t:'latin', col:'#C08A2D'},
  ja:{n:'Japanese',c:'cjk', sib:['zh','ko'], t:'cjk', col:'#B84A6E'},
  ko:{n:'Korean',  c:'cjk', sib:['ja','zh'], t:'cjk', col:'#2E8F8A'},
  zh:{n:'Chinese', c:'cjk', sib:['ja','ko'], t:'cjk', col:'#8A4EB8'},
  ar:{n:'Arabic',  c:'semitic', sib:[], t:'rtl', col:'#3E7DA6'},

const LANE_ORDER = ['es','fr','it','de','nl','ja','ko','zh','ar'];
const DEFAULT_MODE = {es:'prod', nl:'prod', zh:'prod', ar:'prod', fr:'rec', it:'rec', de:'rec', ja:'rec', ko:'rec'};
const BANDS = [[6,9,'the ~500 commonest words'],[5,6,'the top ~2,000'],[4,5,'the top ~10,000'],[3,4,'the top ~50,000'],[2,3,'rare words']];
const STORE_KEY = 'clavis.v1';
const DAY = 86400000;
const READ_LANGS = {ja:'rōmaji', ko:'romanised', zh:'pīnyīn', ar:'romanised'};

// ============================================================ FSRS-5 (default parameters)
const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];

  if(!card.s){ card.s = initS(g); card.d = initD(g); }

    const days = (now - card.last)/DAY;
    if(days < 1) card.s = shortS(card.s, g);
    else { const r = retr(days, card.s); card.s = g===1 ? forgetS(card.d, card.s, r) : recallS(card.d, card.s, r, g); }
    card.d = nextD(card.d, g);
  }
  card.reps = (card.reps||0)+1; if(g===1) card.lapses = (card.lapses||0)+1;
  if(!card.first) card.first = now;
  card.last = now; card.prov = false; card.intro = false; card.g = g;
  card.due = g===1 ? now + 10*60000 : now + ivlDays(card.s, S.settings.retention)*DAY;
}
function cardR(card, now){ return card.s ? retr(Math.max(0,(now-card.last)/DAY), card.s) : 0; }

// ============================================================ state
let D=null, S=null, session=null, T=null;
let byLang={}, byLemma={}, lexArr={}, byPage={};
function freshState(){
  const s = {v:2, created:Date.now(), lanes:{}, cards:{}, tests:{}, seen:{}, bandit:{}, log:[], inter:{}, routes:{}, newDay:'', newToday:{}, pin:null,
    settings:{retention:0.9, newPerDay:10, sessionSize:5, readings:true, monoSession:false, motion:true}, coach:{}, ob:0, onboarded:false, view:'learn'};
  for(const l of LANE_ORDER){ s.lanes[l] = DEFAULT_MODE[l]; s.cards[l] = {}; s.bandit[l] = {w:0.2, hist:[]}; s.inter[l] = {}; s.routes[l] = {}; s.newToday[l]=0; }
  return s;
}
function load(){
  const d = freshState();
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const s = JSON.parse(raw); const merged = Object.assign(d, s); merged.settings = Object.assign(freshState().settings, s.settings||{}); merged.coach = s.coach||{}; return merged; } }catch(e){}
  return d;
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function todayKey(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function rollDay(){ const k = todayKey(); if(S.newDay!==k){ S.newDay=k; for(const l of LANE_ORDER) S.newToday[l]=0; } }
const thr = l => (S.tests[l] && S.tests[l].thr!=null) ? S.tests[l].thr : 9;
const activeLanes = ()=> LANE_ORDER.filter(l=>S.lanes[l]!=='off');
const lemmaOf = t => t[1]===0 ? t[0].toLowerCase() : t[1];
const brOf = t => Array.isArray(t[3]) ? t[3] : null;
const romOf = t => (typeof t[4]==='string' && t[4]) ? t[4] : null;

// ============================================================ corpus indexing
function indexCorpus(){
  for(const l of LANE_ORDER){ byLang[l]=[]; byLemma[l]={}; }
  for(const sc of D.scenes){
    for(const l of LANE_ORDER){
      if(!sc.k[l] || sc.k[l].length===0) continue;
      byLang[l].push(sc.i);
      for(const t of sc.k[l]){ const lm = lemmaOf(t); (byLemma[l][lm] = byLemma[l][lm]||[]).push(sc.i); }
    }
  }
  for(const l of LANE_ORDER){ lexArr[l] = Object.entries(D.lex[l]||{}).map(([w,v])=>[w,v[0],v[1],v[2],v[3]||'']); }
  byPage = {};
  for(const sc of D.scenes) (byPage[sc.m] = byPage[sc.m]||[]).push(sc.i);
  for(const m of Object.keys(byPage)) byPage[m].sort((a,b)=> (Math.round(D.scenes[a].r[1]*12)-Math.round(D.scenes[b].r[1]*12)) || (D.scenes[a].r[0]-D.scenes[b].r[0]));
}

// ============================================================ knowledge model
function isKnown(l, t, now){
  const lm = lemmaOf(t); const c = S.cards[l][lm];
  if(c){ if(c.prov) return true; return cardR(c, now) >= 0.75 && c.g!==1; }
  return t[2] >= thr(l);
}
function sceneStats(l, sc, now){
  let known=0, total=0; const unk = new Map();
  for(const t of sc.k[l]){ total++; if(isKnown(l,t,now)) known++; else { const lm=lemmaOf(t); if(!unk.has(lm)) unk.set(lm, t); } }
  return {cov: total? known/total : 1, unk:[...unk.values()], total};
}
function corpusCoverage(l, now){
  const ids = byLang[l]; if(!ids.length) return 0;
  let ok=0; for(const id of ids){ if(sceneStats(l, D.scenes[id], now).cov >= 0.95) ok++; }
  return ok/ids.length;
}
function dueCards(l, now){ return Object.entries(S.cards[l]).filter(([lm,c])=>c.due<=now && !c.prov && !c.intro).sort((a,b)=>a[1].due-b[1].due); }
function knownCount(l, now){ return Object.values(S.cards[l]).filter(c=>c.prov || (cardR(c,now)>=0.9 && c.g!==1)).length; }

// ============================================================ selection
function seenRecently(id, now){ const t = S.seen[id]; return t && (now - t) < 6*3600000; }
function pickForLane(l, now){
  const due = dueCards(l, now);
  if(due.length){
    const lm = due[0][0];
    const ids = byLemma[l][lm] || [];
    const cands = ids.map(id=>({sc:D.scenes[id], st:sceneStats(l, D.scenes[id], now)}))
      .sort((a,b)=> (b.st.cov - a.st.cov) || (a.st.unk.length - b.st.unk.length) || ((seenRecently(a.sc.i,now)?1:0)-(seenRecently(b.sc.i,now)?1:0)) || (Math.random()-0.5));
    if(cands.length) return {type:'cloze', l, sc:cands[0].sc, lemma:lm, st:cands[0].st, lowCov: cands[0].st.cov < 0.7};
  }
  if(S.newToday[l] < S.settings.newPerDay){
    const last = S.lastScene && S.lastScene[l];
    let best=null, bestScore=-1e9;
    for(const id of byLang[l]){
      if(seenRecently(id, now)) continue;
      const sc = D.scenes[id]; const st = sceneStats(l, sc, now);
      if(st.unk.length===0) continue;
      const nUnk = st.unk.length;
      let score = st.cov*6 - Math.max(0,nUnk-3)*2 + (nUnk<=3?1:0);
      score += (st.unk.reduce((a,t)=>a+t[2],0)/nUnk)*0.6;
      if(last!=null && id===last+1) score += 1.5;
      score += Math.random()*0.8;
      if(score>bestScore){ bestScore=score; best={sc,st}; }
    }
    if(best) return {type:'read', l, sc:best.sc, st:best.st};
  }
  const knownScenes = byLang[l].filter(id=>!seenRecently(id,now) && sceneStats(l, D.scenes[id], now).unk.length===0);
  if(knownScenes.length){ const id = knownScenes[Math.floor(Math.random()*knownScenes.length)]; return {type:'read', l, sc:D.scenes[id], st:sceneStats(l, D.scenes[id], now), fluency:true}; }
  return null;
}

// ============================================================ bandit (ZPDES-lite over lanes)
function lp(l){ const h = S.bandit[l].hist; if(h.length<8) return null; const n=Math.min(8, Math.floor(h.length/2)); const rec=h.slice(-n), old=h.slice(-2*n,-n); const m=a=>a.reduce((x,y)=>x+y,0)/a.length; return Math.abs(m(rec)-m(old)); }
function laneScore(l, now){
  const b = S.bandit[l]; const due = dueCards(l, now).length; const pressure = Math.min(1, due/5);
  const mult = S.lanes[l]==='prod' ? 1.5 : 1.0;
  return {w:b.w, pressure, due, score:(b.w + 0.08 + 0.6*pressure)*mult, lp:lp(l)};
}
function whyText(x){ return x.due ? `${x.due} word${x.due===1?'':'s'} ready to return` : (x.lp!=null && x.lp>0.1 ? 'you\'re improving quickly here' : 'getting to know you'); }
function chooseLane(now, avoid){
  if(S.pin && S.lanes[S.pin]!=='off') return {l:S.pin, why:'pinned by you'};
  let lanes = activeLanes().filter(l=>byLang[l].length);
  if(lanes.length>1 && avoid) lanes = lanes.filter(l=>l!==avoid);
  const scored = lanes.map(l=>({l, ...laneScore(l, now)}));
  if(Math.random()<0.25){ const p = scored[Math.floor(Math.random()*scored.length)]; return {l:p.l, why:'trying something new'}; }
  const tot = scored.reduce((a,x)=>a+x.score,0); let r = Math.random()*tot;
  for(const x of scored){ r -= x.score; if(r<=0) return {l:x.l, why:whyText(x)}; }
  const x = scored[scored.length-1]; return {l:x.l, why:whyText(x)};
}
function reward(l, r){ const b = S.bandit[l]; b.hist.push(r); if(b.hist.length>40) b.hist.shift(); const v = lp(l); if(v!=null) b.w = clamp(0.85*b.w + 0.15*v, 0.02, 1); }

// ============================================================ helpers
const $ = sel => document.querySelector(sel);
const el = (tag, attrs={}, ...kids)=>{ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2), v); else if(v!=null) e.setAttribute(k,v);} for(const k of kids){ if(k==null) continue; e.append(k.nodeType? k : document.createTextNode(String(k))); } return e; };

function pct(x){ return Math.round(x*100)+'%'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dirOf(l){ return l==='ar'?'rtl':'ltr'; }
const CJK_SP = /([\u3040-\u30FF\u3400-\u9FFF\uF900-\uFAFF])\s+(?=[\u3040-\u30FF\u3400-\u9FFF\uF900-\uFAFF])/g;

// ============================================================ the pool
// A soft-focus pool of the languages in play — colour with no hard edge anywhere.
// When words are due it breathes deeper and glows a little warmer.
function orb(container, opts){
  const canvas = el('canvas'); container.append(canvas);
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf=null, t=0, dead=false;
  const lanes = (typeof activeLanes==='function' && S) ? (activeLanes().length? activeLanes() : LANE_ORDER) : LANE_ORDER;
  const drops = lanes.slice(0, 5).map((l,i)=>({
    c: rgbOf(COSMOS_COL[l]),
    a: i*2.39996 + 0.8,                 // golden-angle spacing so they never line up
    sp: 0.10 + 0.035*i,
    rr: 0.30 + 0.13*hash01('drop'+l),
  }));
  function draw(){
    if(dead) return;
    const w = canvas.clientWidth||280, h = canvas.clientHeight||280, dpr = Math.min(devicePixelRatio||1, 2);
    if(canvas.width!==w*dpr){ canvas.width=w*dpr; canvas.height=h*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const cx=w/2, cy=h/2, R0=Math.min(w,h)*0.34;
    const due = opts.due();
    const breath = 1 + (due? 0.06 : 0.025)*Math.sin(t*(due? 1.5 : 0.8));
    const al = due? 0.5 : 0.36;
    for(const d of drops){
      const ang = d.a + t*d.sp;
      const px = cx + Math.cos(ang)*R0*0.42, py = cy + Math.sin(ang*0.93 + d.a)*R0*0.38;
      const rad = R0*d.rr*1.7*breath;
      const g = ctx.createRadialGradient(px,py,0, px,py,rad);
      g.addColorStop(0, `rgba(${d.c[0]},${d.c[1]},${d.c[2]},${al})`);
      g.addColorStop(0.55, `rgba(${d.c[0]},${d.c[1]},${d.c[2]},${al*0.4})`);
      g.addColorStop(1, `rgba(${d.c[0]},${d.c[1]},${d.c[2]},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,rad,0,7); ctx.fill();
    }
    t += 0.016;
    if(!reduced) raf = requestAnimationFrame(draw);
  }
  draw();
  return ()=>{ dead=true; if(raf) cancelAnimationFrame(raf); };
}

// ============================================================ the veil — one substance, three states
// Learn, Cosmos and Paths are three arrangements of the same words, so moving between
// them carries the same soft pool of colour — the drops from the Learn pool drift and
// re-settle into the Cosmos horizon or the Paths rail. All soft focus, no hard edges.
const MORPH = {view:null, raf:null, canvas:null, ctx:null, pending:null, running:false, cur:null};
const MORPH_MS = 520;
function morphRect(sel, fb){
  const e = document.querySelector(sel); if(!e) return fb;
  const r = e.getBoundingClientRect();
  return (r.width>40 && r.height>40 && r.top < innerHeight && r.bottom > 0) ? r : fb;
}
// Each view is the same body under a different pull: a held drop, a long horizon, a spine.
// Those three map to what is actually on each screen — the pool, the field, the tree's rail.
function morphShape(view){
  const vw = innerWidth, vh = innerHeight;
  if(view==='learn'){
    const r = morphRect('.orbwrap', {left:vw/2-130, top:vh*0.20, width:260, height:260});
    const R = Math.min(r.width, r.height)*0.335;
    return {cx:r.left+r.width/2, cy:r.top+r.height/2, rx:R, ry:R};
  }
  if(view==='cosmos'){
    const r = morphRect('.cosmos-wrap', {left:14, top:vh*0.18, width:vw-28, height:vh*0.5});
    return {cx:r.left+r.width/2, cy:r.top+r.height*0.60, rx:r.width*0.46, ry:r.height*0.055};
  }
  if(view==='paths'){
    const r = morphRect('.tree', morphRect('.cosmos-wrap', {left:14, top:vh*0.22, width:vw-28, height:vh*0.46}));
    const h = Math.min(r.height, vh*0.56);
    return {cx:r.left + 16, cy:r.top + h/2, rx:19, ry:h*0.44};   // the rail the branches hang off
  }
  return null;
}
function morphCanvas(){
  if(!MORPH.canvas){
    MORPH.canvas = el('canvas',{class:'morphveil', 'aria-hidden':'true'});
    document.body.append(MORPH.canvas);
    MORPH.ctx = MORPH.canvas.getContext('2d');
  }
  const dpr = Math.min(devicePixelRatio||1, 2);
  const w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
  if(MORPH.canvas.width !== w || MORPH.canvas.height !== h){ MORPH.canvas.width = w; MORPH.canvas.height = h; }
  MORPH.ctx.setTransform(dpr,0,0,dpr,0,0);
  return MORPH.ctx;
}
function morphClear(){
  MORPH.pending = null; MORPH.cur = null;
  if(MORPH.raf){ cancelAnimationFrame(MORPH.raf); MORPH.raf = null; }
  MORPH.running = false;
  if(MORPH.canvas){ MORPH.canvas.style.opacity = '0'; if(MORPH.ctx) MORPH.ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function morphBegin(nextKey){
  const prev = MORPH.view; MORPH.view = nextKey;
  const ok = ['learn','cosmos','paths'];
  if(!prev || !nextKey || prev===nextKey || !ok.includes(prev) || !ok.includes(nextKey)){ morphClear(); return; }
  if(!S || !S.settings.motion || matchMedia('(prefers-reduced-motion: reduce)').matches){ morphClear(); return; }
  const from = MORPH.running && MORPH.cur ? MORPH.cur : morphShape(prev);   // interrupting mid-flight picks up where it is
  MORPH.pending = from ? {from} : null;
  if(MORPH.raf){ cancelAnimationFrame(MORPH.raf); MORPH.raf = null; }
}
function morphEnd(){
  if(!MORPH.pending) return;
  const from = MORPH.pending.from; MORPH.pending = null;
  const view = MORPH.view;
  requestAnimationFrame(()=>{
    if(MORPH.view!==view) return;
    const to = morphShape(view); if(!to) return;
    const ctx = morphCanvas(), cv = MORPH.canvas;
    const lanes = activeLanes().length? activeLanes() : LANE_ORDER;
    const drops = lanes.slice(0, 6).map((l,i)=>({
      c: rgbOf(COSMOS_COL[l]), a: i*2.39996 + 0.6, jr: hash01('v'+l), sp: 0.5 + 0.2*(i%3) }));
    const ease = u => u<0.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;
    const lerp = (a,b,u)=> a + (b-a)*u;
    const t0 = performance.now();
    MORPH.running = true;
    function frame(now){
      const t = clamp((now-t0)/MORPH_MS, 0, 1);   // never extrapolate: a clock that jumps backwards would invert the body
      const q = ease(t);
      // the drops gather to travel, then settle into the new arrangement
      const gather = 1 - 0.45*Math.sin(q*Math.PI);
      const sh = {cx:lerp(from.cx,to.cx,q), cy:lerp(from.cy,to.cy,q),
                  rx:lerp(from.rx,to.rx,q)*gather, ry:lerp(from.ry,to.ry,q)*gather};
      MORPH.cur = sh;
      ctx.clearRect(0,0,innerWidth,innerHeight);
      const base = Math.min(innerWidth, innerHeight);
      for(const d of drops){
        const ang = d.a + t*d.sp;
        const px = sh.cx + Math.cos(ang)*sh.rx*0.7, py = sh.cy + Math.sin(ang*0.95 + d.a)*sh.ry*0.7;
        const rad = clamp((Math.max(sh.rx,sh.ry)*0.5 + d.jr*base*0.04) , base*0.09, base*0.26);
        const g = ctx.createRadialGradient(px,py,0, px,py,rad);
        g.addColorStop(0, `rgba(${d.c[0]},${d.c[1]},${d.c[2]},0.5)`);
        g.addColorStop(0.55, `rgba(${d.c[0]},${d.c[1]},${d.c[2]},0.2)`);
        g.addColorStop(1, `rgba(${d.c[0]},${d.c[1]},${d.c[2]},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px,py,rad,0,6.2832); ctx.fill();
      }
      cv.style.opacity = String((t > 0.6 ? Math.max(0, (1-t)/0.4) : Math.min(1, t/0.08)));
      if(t<1){ MORPH.raf = requestAnimationFrame(frame); }
      else { MORPH.running=false; MORPH.raf=null; MORPH.cur=null; cv.style.opacity='0'; ctx.clearRect(0,0,innerWidth,innerHeight); }
    }
    MORPH.raf = requestAnimationFrame(frame);
  });
}

  if(cosmosStop){ cosmosStop(); cosmosStop=null; }
  const morphKey = (!S.onboarded || T || session) ? null : ((S.view||'learn'));
  morphBegin(morphKey);

      ctx.fillStyle = paint(pt.rgb, e, crest);
      const s = clamp(pt.sz*cam.focal*0.0017/p0.zc*3.4*(0.8+0.5*pt.h*e), 0.6, 5.5) * (0.45+0.55*e);
      drawDot(p0.x, p0.y, s, pt.ell, pt.rot);
    }
    if(wave>=1){
      ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.textAlign='center';
      for(const fam of Object.keys(FAM_ANGLE)){
        const a = FAM_ANGLE[fam];
        const p = proj(cam, 0.62*Math.cos(a), 0.46, 0.62*Math.sin(a), w, hh); if(!p) continue;
        ctx.globalAlpha = 0.62*(1-clamp((p.zc-0.5)/4.6,0,0.72));
        ctx.fillStyle = LBL; ctx.fillText(FAM_LABEL[fam], p.x, p.y);
      }
    }
    if(hover && hover!==selected && wave>=1 && hover._x>-8e3){
      ctx.globalAlpha=0.7; ctx.strokeStyle=RING; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(hover._x,hover._y,6,0,7); ctx.stroke();
    }
    if(selected && wave>=1 && selected._x>-8e3){
      ctx.globalAlpha = 0.95; ctx.lineWidth = 1.2;
      for(const r of relsOf(selected)){
        const q = data.index.get(r[0]+'|'+r[1]); if(!q || q._x<-8e3) continue;
        ctx.strokeStyle = r[2]==='bor' ? REL_BOR : REL_KIN;
        ctx.beginPath(); ctx.moveTo(selected._x,selected._y); ctx.lineTo(q._x,q._y); ctx.stroke();
        ctx.fillStyle = `rgb(${q.rgb[0]},${q.rgb[1]},${q.rgb[2]})`; ctx.beginPath(); ctx.arc(q._x,q._y, 4.5, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.strokeStyle = RING; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(selected._x, selected._y, 8, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if(focus) drawFocus(w, hh);
    ctx.globalAlpha = 1;
    if(animating()){ t += 0.016; if(wave<1) wave = Math.min(1, wave + 0.0062); raf = requestAnimationFrame(draw); }
  }
  function relsOf(pt){
    const et = D.etym && D.etym[pt.l] && D.etym[pt.l][pt.lm];
    return (et && et.e) ? et.e : [];
  }
  function select(pt, quiet){
    if(!pt) return;
    if(!quiet) pushHist();
    selected = pt; card.hidden = false; card.innerHTML='';
    const v2 = D.lex[pt.l][pt.lm]||[]; const surf = v2[2]||pt.lm; const read = v2[3]||'';
    const et = D.etym && D.etym[pt.l] && D.etym[pt.l][pt.lm];
    const top = el('div',{class:'row'});
    top.append(el('span',{class:'w', dir:dirOf(pt.l), lang:pt.l}, surf));
    if(read) top.append(el('span',{class:'small'}, read));
    top.append(el('span',{class:'small grow'}, laneDot(pt.l), ' '+LANGS[pt.l].n));
    if(canSpeak(pt.l)) top.append(speakBtn(surf, pt.l));
    top.append(el('button',{class:'quiet', onclick:()=>{ selected=null; focus=null; card.hidden=true; if(!animating()) draw(); }}, '✕'));
    card.append(top);
    const oline = et && et.o ? `${et.ot==='bor'?'borrowed from':'grew from'} ${et.o}` : 'origin not yet in the graph';
    card.append(el('div',{class:'o'}, oline, ' · you hold it at '+pct(pt.h)+' · '+bandLabel(pt.zf)));
    const rels = relsOf(pt);
    const rr = el('div',{class:'rels'});
    if(rels.length || (et && et.o)){
      rr.append(el('button',{class:'accent', onclick:()=>{ pushHist(); focus = makeFocus(pt); card.hidden = true; if(!animating()) draw(); refreshTools(); }}, 'See its web'));
    }
    for(const r of rels.slice(0,6)){
      const q = data.index.get(r[0]+'|'+r[1]);
      const lab = (D.lex[r[0]] && D.lex[r[0]][r[1]] ? (D.lex[r[0]][r[1]][2]||r[1]) : r[1]);
      rr.append(el('button',{onclick:()=>{ if(q) select(q); else toast(langName(r[0])+' · '+lab+' — outside your nine lanes'); }}, laneDot(r[0]), ' '+lab, el('span',{class:'small'}, ' '+langName(r[0])+(r[2]==='bor'?' · borrowed':' · kin'))));
    }
    if(rr.children.length) card.append(rr);
    if(!animating()) draw();
  }
  function nearest(mx, my, radius){
    let best=null, bestScore=1e9;
    for(const pt of data.pts){
      if(pt._x < -8e3) continue;
      const dx=pt._x-mx, dy=pt._y-my; const d=Math.hypot(dx,dy);
      if(d > radius) continue;
      const score = d - pt.h*9 - Math.min(pt.zf,6)*1.2;
      if(score < bestScore){ bestScore=score; best=pt; }
    }
    return best;
  }
  const pointers = new Map(); let pinch0 = null;
  function refreshHud(){ resetBtn.hidden = !moved(); }
  const local = e => { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  canvas.addEventListener('pointerdown', e=>{
    if(wave<1) wave=1;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){ const [a1,b1]=[...pointers.values()]; pinch0 = {d:Math.hypot(a1.x-b1.x,a1.y-b1.y), r:camR}; drag=null; return; }
    drag={x:e.clientX,y:e.clientY,moved:false};
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch0 && pointers.size===2){
      const [a1,b1]=[...pointers.values()]; const d=Math.hypot(a1.x-b1.x,a1.y-b1.y);
      camR = clamp(pinch0.r * (pinch0.d/Math.max(d,1)), 1.15, 4.6); refreshHud();
      if(!animating()) draw();
      return;
    }
    if(!drag){
      if(e.pointerType==='mouse'){
        if(wave>=1 && !focus){
          const q = local(e); const h = nearest(q.x, q.y, 22);
          if(h!==hover){ hover=h; canvas.style.cursor = h? 'pointer':'grab'; if(!animating()) draw(); }
        }
      }
      return;
    }
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    theta += dx*0.005;
    camH = clamp(camH + dy*0.006, 0.4, 2.2);
    refreshHud();
    drag.x=e.clientX; drag.y=e.clientY;
    if(!animating()) draw();
  });
  const endPointer = e=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinch0=null; };
  canvas.addEventListener('pointercancel', e=>{ endPointer(e); drag=null; });
  canvas.addEventListener('pointerup', e=>{
    endPointer(e);
    const wasDrag = drag && drag.moved; drag=null;
    if(wasDrag || pinch0) return;
    const q = local(e);
    if(focus){
      const hit = focus.nodes.find(n=> n._x!=null && Math.hypot(n._x-q.x, n._y-q.y) < n._r+8);
      if(hit && hit.k==='kin'){ const p = data.index.get(hit.l+'|'+hit.lm); if(p){ pushHist(); select(p, true); card.hidden=true; focus = makeFocus(p); if(!animating()) draw(); return; } }
      pushHist(); focus=null; if(selected) select(selected, true); if(!animating()) draw(); return;
    }
    const best = nearest(q.x, q.y, 30);
    if(best) select(best); else { pushHist(); selected=null; card.hidden=true; if(!animating()) draw(); }
  });
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); camR = clamp(camR * (1 + Math.sign(e.deltaY)*0.12), 1.15, 4.6); refreshHud(); if(!animating()) draw(); }, {passive:false});
  canvas.style.height = Math.round(Math.min((canvas.clientWidth||360)*1.12, innerHeight*0.66))+'px';
  refreshTools();
  if(S.cosmos.webFor){ const p = data.index.get(S.cosmos.webFor); S.cosmos.webFor=null; save(); if(p){ wave=1; selected=p; focus=makeFocus(p); } }
  draw();
  cosmosStop = ()=>{ dead=true; if(raf) cancelAnimationFrame(raf); };
}

// ---- Explore: the same field laid flat, with real instruments (AntV G6, MIT)
function renderExploreView(v, data, now){
  const wrap = el('div',{class:'cosmos-wrap grainy'});
  const box = el('div',{class:'explore-box'}); wrap.append(box);
  const hud = el('div',{class:'cosmos-hud'});
  hud.append(cosmosModeGroup('explore'));
  const g2 = el('div',{class:'hgroup'});
  const fitBtn = el('button',{title:'Fit everything back in view', onclick:()=>{ if(graph) graph.fitView().catch(()=>{}); }}, 'Fit');
  g2.append(fitBtn);
  hud.append(g2); wrap.append(hud);
  const tools = el('div',{class:'cosmos-tools'});
  const card = el('div',{class:'wordcard'}); card.hidden = true;
  const hint = el('div',{class:'cosmos-hint'}, 'pinch to zoom · drag to pan · tap a word');
  wrap.append(card, hint, tools);
  v.append(wrap);

  const legend = el('div',{class:'cosmos-legend'});
  legend.append(el('div',{}, 'The field from straight above — the words nearest your path, kept legible. The ', el('b',{},'fisheye'), ' spreads the crowd under your finger apart until the words are readable, without losing the surroundings', cite(36,37), '. ', el('b',{},'Relations'), ' shows only the kinship and borrowing edges inside its lens, labelled', cite(38), '. ', el('b',{},'Families'), ' wraps each family\'s lit words in a smooth contour', cite(39), '. With a lens on, dragging moves the lens; otherwise drag pans, and any speck can be picked up and moved.'));
  legend.append(el('div',{class:'fambar'}));
  v.append(legend);
  v.append(wordSearchRow('find a word…', q=>{
    const p = pts.find(p=>p.lm.toLowerCase().startsWith(q) || (D.lex[p.l][p.lm][2]||'').toLowerCase().startsWith(q));
    if(p && graph){ const id = p.l+'|'+p.lm; graph.focusElement(id).then(()=>showCard(id)).catch(()=>showCard(id)); }
    else toast('Not among the words drawn here — the Field holds the rest');
  }));

  const W2 = Math.min(innerWidth-28, 572);
  const H2 = Math.round(Math.min(W2*1.05, innerHeight*0.62));
  box.style.height = H2+'px';
  const GREY = rgbOf(cssVar('--cosmos-grey') || '#96958B');
  const LBL = cssVar('--cosmos-label') || '#F2EFE4';
  const LBLBG = cssVar('--cosmos-labelbg') || 'rgba(18,18,15,.62)';
  const RING = cssVar('--cosmos-ring') || '#FFFDF6';
  const REL_BOR = cssVar('--rel-bor') || '#FFD98A';
  const REL_KIN = cssVar('--rel-kin') || '#DDE3FF';

  // subsample: every word you've touched, plus everything with etymology, plus the commonest — capped
  const CAP = 1250, SCALE = 300;
  const scored = data.pts.map(p=>{
    const c = S.cards[p.l] && S.cards[p.l][p.lm];
    const et = D.etym && D.etym[p.l] && D.etym[p.l][p.lm];
    return [p.zf + (c?8:0) + ((et && (et.e||et.o))?3:0) + (p.h>0?2:0), p];
  }).sort((a,b)=>b[0]-a[0]);
  const pts = scored.slice(0, CAP).map(x=>x[1]);
  const inSet = new Set(pts.map(p=>p.l+'|'+p.lm));
  const nodes = pts.map(p=>{
    const e = Math.max(p.h, 0.24);
    const size = clamp(5 + (p.zf-1.5)*1.6 + p.h*9, 5, 19);
    return {id: p.l+'|'+p.lm, data:{l:p.l, lm:p.lm, h:p.h, fam:p.fam, size},
      style:{ x: Math.round(p.x*SCALE), y: Math.round(p.z*SCALE), size,
        fill: mixToward(p.rgb, GREY, e), fillOpacity: 0.5+0.5*e,
        label: true, labelText: surfaceOf(p.l, p.lm), labelFill: LBL, labelFontSize: 11, labelFontFamily: 'Hind',
        labelBackground: true, labelBackgroundFill: LBLBG, labelBackgroundRadius: 4, labelBackgroundPadding: [1,4],
        stroke: RING, lineWidth: p.h>0.5? 0.8 : 0, zIndex: Math.round(e*10) }};
  });
  const edges = [];
  for(const e2 of data.edges){
    const ia = e2.a.l+'|'+e2.a.lm, ib = e2.b.l+'|'+e2.b.lm;
    if(!inSet.has(ia) || !inSet.has(ib)) continue;
    edges.push({id:'rel'+edges.length, source:ia, target:ib, data:{t:e2.t},
      style:{ stroke: e2.t==='bor' ? REL_BOR : REL_KIN, lineWidth: 1, strokeOpacity: 0.2,
        lineDash: e2.t==='bor' ? [4,3] : [], zIndex: -1 }});
  }
  const famMembers = {};
  for(const fam of Object.keys(FAM_ANGLE)){
    famMembers[fam] = pts.filter(p=>p.fam===fam && p.h>0.03).sort((a,b)=>b.h-a.h).slice(0,60).map(p=>p.l+'|'+p.lm);
  }

  let graph = null, dead = false;
  const basePlugins = ()=>{
    const P = [{type:'history', key:'hist'}];
    const lensR = Math.round(Math.min(W2,H2)*0.24);
    if(S.cosmos.exlens==='fisheye') P.push({type:'fisheye', key:'fe', trigger:'drag', r: lensR*1.12, d: 3.4, maxD: 5, scaleDBy:'wheel', showDPercent: false,
      style:{stroke: RING, strokeOpacity:0.5, fill:'rgba(128,128,134,.08)', lineWidth:1},
      nodeStyle: d=>({label:true, labelFontSize:12, labelFill: LBL, labelBackground:true, labelBackgroundFill: LBLBG,
        size: Math.min((d.data && d.data.size || 10)*1.15, 26), zIndex: 200})});
    if(S.cosmos.exlens==='relations') P.push({type:'edge-filter-lens', key:'efl', trigger:'drag', r: lensR, nodeType:'both',
      style:{stroke: RING, strokeOpacity:0.5, fill:'rgba(128,128,134,.07)', lineWidth:1},
      nodeStyle:{label:true, labelFontSize:10.5, labelFill: LBL},
      edgeStyle: d=>({label:true, labelText: (d.data && d.data.t==='bor') ? 'borrowed' : 'kin', labelFontSize:9,
        labelFill: LBL, labelBackground:true, labelBackgroundFill: LBLBG,
        stroke: (d.data && d.data.t==='bor') ? REL_BOR : REL_KIN, strokeOpacity:0.95, lineWidth:1.6})});
    if(S.cosmos.exsets){
      for(const fam of Object.keys(famMembers)){
        if(famMembers[fam].length>=3) P.push({type:'bubble-sets', key:'bs-'+fam, members: famMembers[fam],
          fill: FAM_COL[fam], fillOpacity: 0.07, stroke: FAM_COL[fam], strokeOpacity: 0.6, lineWidth: 1.2});
      }
    }
    return P;
  };
  const mkTool = (id, label, title)=> el('button',{class:(S.cosmos.exlens===id?'on':''), title, onclick:()=>{
    S.cosmos.exlens = (S.cosmos.exlens===id ? 'off' : id); save(); applyTools(); }}, label);
  const bFish = mkTool('fisheye','Fisheye','Spread the crowd under your finger until the words are readable');
  const bRel  = mkTool('relations','Relations','Show only the kinship and borrowing edges inside the lens');
  const bSets = el('button',{class:(S.cosmos.exsets?'on':''), title:'Wrap each family\'s lit words in a contour', onclick:()=>{
    S.cosmos.exsets = !S.cosmos.exsets; save(); applyTools(); }}, 'Families');
  const bUndo = el('button',{title:'Undo', onclick:()=>{ try{ const h=histOf(); if(h && h.canUndo && h.canUndo()) h.undo(); }catch(e){} }}, '↶');
  const bRedo = el('button',{title:'Redo', onclick:()=>{ try{ const h=histOf(); if(h && h.canRedo && h.canRedo()) h.redo(); }catch(e){} }}, '↷');
  tools.append(bFish, bRel, bSets, bUndo, bRedo);
  const histOf = ()=>{ try{ return graph && graph.getPluginInstance ? graph.getPluginInstance('hist') : null; }catch(e){ return null; } };
  function applyTools(){
    bFish.className = S.cosmos.exlens==='fisheye' ? 'on' : '';
    bRel.className  = S.cosmos.exlens==='relations' ? 'on' : '';
    bSets.className = S.cosmos.exsets ? 'on' : '';
    hint.textContent = S.cosmos.exlens==='off' ? 'pinch to zoom · drag to pan · tap a word'
      : 'tap places the lens · drag moves it · pinch still zooms';
    if(!graph) return;
    try{
      graph.setPlugins(basePlugins());
      graph.updateBehavior({key:'pan', enable: S.cosmos.exlens==='off'});
      graph.updateBehavior({key:'dragel', enable: S.cosmos.exlens==='off'});
      // while a lens is on, resting labels yield to the lens: adaptive labels off, base labels off
      graph.updateBehavior({key:'adapt', enable: S.cosmos.exlens==='off'});
      graph.draw().then(()=>{
        // bubble-sets added after render draw on the next AFTER_RENDER — nudge one
        if(S.cosmos.exsets && G6.GraphEvent) graph.emit(G6.GraphEvent.AFTER_RENDER, {});
      }).catch(()=>{});
    }catch(e){}
  }
  function showCard(id){
    const p = data.index.get(id); if(!p) return;
    card.hidden = false; card.innerHTML = '';
    const v2 = D.lex[p.l][p.lm]||[]; const surf = v2[2]||p.lm; const read = v2[3]||'';
    const et = D.etym && D.etym[p.l] && D.etym[p.l][p.lm];
    const top = el('div',{class:'row'});
    top.append(el('span',{class:'w', dir:dirOf(p.l), lang:p.l}, surf));
    if(read) top.append(el('span',{class:'small'}, read));
    top.append(el('span',{class:'small grow'}, laneDot(p.l), ' '+LANGS[p.l].n));
    if(canSpeak(p.l)) top.append(speakBtn(surf, p.l));
    card.append(top);
    card.append(el('button',{class:'quiet close', 'aria-label':'Close', onclick:()=>{ card.hidden=true; }}, '✕'));
    const oline = et && et.o ? `${et.ot==='bor'?'borrowed from':'grew from'} ${et.o}` : 'origin not yet in the graph';
    card.append(el('div',{class:'o'}, oline, ' · you hold it at '+pct(p.h)+' · '+bandLabel(p.zf)));
    const rels = (et && et.e) ? et.e : [];
    const rr = el('div',{class:'rels'});
    if(rels.length || (et && et.o)){
      rr.append(el('button',{class:'accent', onclick:()=>{ S.cosmos.mode='depth'; S.cosmos.webFor = id; save(); render(); }}, 'See its web'));
    }
    for(const r of rels.slice(0,6)){
      const oid = r[0]+'|'+r[1];
      const lab = (D.lex[r[0]] && D.lex[r[0]][r[1]] ? (D.lex[r[0]][r[1]][2]||r[1]) : r[1]);
      rr.append(el('button',{onclick:()=>{
        if(inSet.has(oid) && graph){ graph.focusElement(oid).then(()=>showCard(oid)).catch(()=>showCard(oid)); }
        else if(data.index.get(oid)) { showCard(oid); }
        else toast(langName(r[0])+' · '+lab+' — outside your nine lanes');
      }}, laneDot(r[0]), ' '+lab, el('span',{class:'small'}, ' '+langName(r[0])+(r[2]==='bor'?' · borrowed':' · kin'))));
    }
    if(rr.children.length) card.append(rr);
  }
  (async ()=>{
    try{
      graph = new G6.Graph({
        container: box, width: box.clientWidth || W2, height: H2, animation: false, padding: 18,
        data: {nodes, edges},
        autoFit: 'view',
        behaviors: [
          {type:'zoom-canvas', key:'zoom'},
          {type:'drag-canvas', key:'pan'},
          {type:'drag-element', key:'dragel'},
          {type:'auto-adapt-label', key:'adapt', throttle: 150},
        ],
        plugins: basePlugins(),
      });
      await graph.render();
      if(dead){ graph.destroy(); return; }
      box._graph = graph;
      graph.on('node:click', ev=>{ if(S.cosmos.exlens!=='off') return; const id = ev.target && ev.target.id; if(id) showCard(id); });
      graph.on('canvas:click', ()=>{ if(S.cosmos.exlens==='off') card.hidden = true; });
      applyTools();
    }catch(err){ box.append(el('div',{class:'loading'}, 'The Explore view could not start here: '+esc(err.message))); }
  })();
  cosmosStop = ()=>{ dead = true; try{ if(graph) graph.destroy(); }catch(e){} graph = null; };
}

// ============================================================ story mode (just reading)
function renderStory(v){
  S.story = S.story || {lane:'es', ep:null, pi:0};
  const st = S.story;
  const lanes = activeLanes();
  const laneSel = el('div',{class:'row'});
  for(const l of lanes){ laneSel.append(el('button',{class:st.lane===l?'primary':'', style:'padding:6px 10px;font-size:.85rem', onclick:()=>{ st.lane=l; st.ep=null; st.pi=0; save(); render(); }}, laneDot(l), ' '+LANGS[l].n)); }
  v.append(laneSel);
  // a few episodes only align in one or two languages; they'd open on a title card
  const epCount = {};
  for(const s of D.scenes) if(s.x[st.lane]) epCount[s.e] = (epCount[s.e]||0)+1;
  let eps = Object.keys(epCount).map(Number).filter(e=>epCount[e]>=6).sort((a,b)=>a-b);
  if(!eps.length) eps = Object.keys(epCount).map(Number).sort((a,b)=>a-b);
  if(st.ep==null || !eps.includes(st.ep)) st.ep = eps[0];
  const epSel = el('div',{class:'row', style:'margin-top:8px'});
  epSel.append(el('span',{class:'small'},'Episode'));
  const sel = el('select',{style:'font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)', onchange:e=>{ st.ep=parseInt(e.target.value); st.pi=0; save(); render(); }});
  for(const e of eps) sel.append(el('option',{value:String(e), selected: e===st.ep? '':null}, 'Episode '+e));
  epSel.append(sel);
  v.append(epSel);
  const pages = [...new Set(D.scenes.filter(s=>s.e===st.ep && s.x[st.lane]).map(s=>s.m))];
  st.pi = clamp(st.pi, 0, pages.length-1);
  const m = pages[st.pi];
  const pageScenes = D.scenes.filter(s=>s.e===st.ep && s.m===m && s.x[st.lane])
    .sort((a,b)=> (Math.round(a.r[1]*12)-Math.round(b.r[1]*12)) || (a.r[0]-b.r[0]));
  const box = el('div',{class:'scene full', style:'margin-top:10px'});
  box.append(el('img',{src:IMAGES[m], alt:'comic page'}));
  const rows = [];
  const nLettered = pageScenes.length ? letterPage(box, pageScenes[0], st.lane, {numbers:true, noHalo:true,
    onTap:(s2, i)=>{ speak(s2.x[st.lane], st.lane); const row = rows[i];
      if(row){ row.scrollIntoView({block:'center', behavior:'smooth'}); row.classList.add('lit'); setTimeout(()=>row.classList.remove('lit'), 1600); } }}) : 0;
  v.append(box);
  v.append(el('p',{class:'scenehint'}, nLettered
    ? 'The page is lettered in ' + LANGS[st.lane].n + ' — tap a balloon to hear it and jump to its line.'
    : 'The numbers mark where each line is spoken.'));
  pageScenes.forEach((sc,i)=>{
