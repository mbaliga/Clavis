// ============================================================ tests
function startTest(l){
  const rnd = a=>a[Math.floor(Math.random()*a.length)];
  const items = [];
  const pool = lexArr[l].filter(x=> x[2]>0 && (LANGS[l].t!=='latin' || (x[0].length>=3 && /^[^\W\d_]+$/u.test(x[0]))) && !/^[A-Z]/.test(x[3]||''));
  for(const [lo,hi] of BANDS){ const band = pool.filter(x=>x[2]>=lo && x[2]<hi); const take = Math.min(8, band.length); const used=new Set();
    for(let i=0;i<take;i++){ let x, guard=0; do{ x=rnd(band); guard++; }while(used.has(x[0]) && guard<50); used.add(x[0]); items.push({w:x[3]||x[0], lm:x[0], z:x[2], r:x[4]||'', real:true}); } }
  for(const p of (D.pseudo[l]||[]).slice(0,8)) items.push({w:p, lm:p, z:0, r:'', real:false});
  items.sort(()=>Math.random()-0.5);
  T = {l, items, i:0, yes:new Set(), start:Date.now()};
  render();
}
function renderTest(v){
  const it = T.items[T.i];
  v.append(el('div',{class:'row'}, laneDot(T.l), el('b',{}, LANGS[T.l].n), el('span',{class:'small'}, `· do you know this word? · ${T.i+1}/${T.items.length}`)));
  v.append(el('p',{class:'small'}, '"Know" means you could say what it means. Some words are invented — saying yes to those lowers your estimate, so be honest.'));
  const pb = el('div',{class:'progressbar'}); pb.append(el('i',{style:`width:${(T.i/T.items.length)*100}%`})); v.append(pb);
  const card = el('div',{class:'card'});
  card.append(el('div',{class:'testword'+(LANGS[T.l].t!=='latin'?' plain':''), dir:dirOf(T.l), lang:T.l}, it.w));
  card.append(el('div',{class:'testread'}, S.settings.readings && it.r ? it.r : ' '));
  if(canSpeak(T.l) && it.real) card.append(el('div',{style:'text-align:center;margin-bottom:8px'}, speakBtn(it.w, T.l, true)));
  const answer = yes=>{ if(yes) T.yes.add(T.i); T.i++; if(T.i>=T.items.length) finishTest(); else render(); };
  card.append(el('div',{class:'actions'}, el('button',{onclick:()=>answer(false)}, "Don't know"), el('button',{class:'primary', onclick:()=>answer(true)}, 'Know it')));
  v.append(card);
  v.append(el('button',{class:'quiet', onclick:()=>{ T=null; render(); }}, 'Cancel'));
  document.onkeydown = e=>{ if(!T) return; if(e.key==='ArrowRight'||e.key==='y') answer(true); if(e.key==='ArrowLeft'||e.key==='n') answer(false); };
}
function finishTest(){
  const l = T.l;
  const pseudo = T.items.map((x,i)=>[x,i]).filter(([x])=>!x.real);
  const fa = pseudo.length ? pseudo.filter(([x,i])=>T.yes.has(i)).length/pseudo.length : 0;
  const bands = BANDS.map(([lo,hi,lab])=>{ const idx = T.items.map((x,i)=>[x,i]).filter(([x])=>x.real && x.z>=lo && x.z<hi); const hits = idx.filter(([x,i])=>T.yes.has(i)).length; return {lo,hi,lab,n:idx.length,hit: idx.length? hits/idx.length : null}; });
  let thrZ = 9;
  for(const b of bands){ if(b.n===0) continue; const adj = b.hit - fa; if(adj >= 0.6) thrZ = b.lo; else break; }
  const now = Date.now();
  T.items.forEach((x,i)=>{ if(!x.real) return;
    if(T.yes.has(i)){ S.cards[l][x.lm] = S.cards[l][x.lm] || {prov:true, s:0, d:0, due:now+30*DAY, last:now, reps:0, lapses:0, g:3}; }
    else if(x.z>=thrZ){ S.cards[l][x.lm] = S.cards[l][x.lm] || {intro:true, s:0, d:0, due:now, last:now, reps:0, lapses:0, g:1}; } });
  S.tests[l] = {done:now, thr:thrZ, fa, bands, ms:now-T.start};
  S.log.push({t:now, l, type:'test', thr:thrZ, fa});
  save(); T=null; document.onkeydown=null;
  toast(thrZ>=9 ? `${LANGS[l].n}: treated as brand new — every word will earn its place` : `${LANGS[l].n}: Clavis now assumes you know ${bandLabel(thrZ)}`);
  render();
}

// ============================================================ session
function startSession(){
  rollDay();
  session = {i:0, n:S.settings.sessionSize, start:Date.now(), lanes:[], correct:0, newWords:0, done:false};
  if(S.intent){ session.hold = S.intent.l; session.holdWhy = 'the path you chose'; session.intentScene = S.intent.sc; S.intent = null; save(); }
  else if(S.settings.monoSession){ const c = chooseLane(Date.now(), null); session.hold = c.l; session.holdWhy = c.why; }
  nextEncounter();
}
function makeEcho(now){
  const lanes = activeLanes().filter(l=>byLang[l].length).sort(()=>Math.random()-0.5);
  for(const l of lanes){
    const mets = Object.entries(S.cards[l]).filter(([lm,c])=>!c.prov && c.reps>=1 && (now-c.last)>20*3600000);
    if(!mets.length) continue;
    for(const [lm,c] of mets.sort(()=>Math.random()-0.5).slice(0,6)){
      const ids = (byLemma[l][lm]||[]).filter(id=>!S.seen[id]);
      for(const id of ids.sort(()=>Math.random()-0.5).slice(0,4)){
        const sc = D.scenes[id]; const st = sceneStats(l, sc, now);
        if(st.cov >= 0.7){ const tok = sc.k[l].find(t=>lemmaOf(t)===lm); return {type:'echo', l, sc, lemma:lm, tok, card:c, st}; }
      }
    }
  }
  return null;
}
function nextEncounter(){
  const now = Date.now();
  if(session.i >= session.n){ session.done=true; S.lastSession = {t:now, correct:session.correct, n:session.n, newWords:session.newWords, lanes:session.lanes}; save(); render(); return; }
  if(session.intentScene != null){
    const sc = D.scenes[session.intentScene]; session.intentScene = null;
    const l = session.hold; const st = sceneStats(l, sc, now);
    if(st.unk.length){ session.cur = {type:'read', l, sc, st, why:'the path you chose'}; session.lanes.push(l); render(); return; }
  }
  const avoid = session.hold? null : session.lanes[session.lanes.length-1];
  if(!session.hold && session.i === session.n-1 && activeLanes().length>=3 && Math.random()<0.7){
    session.cur = makeLangId(now); render(); return;
  }
  if(session.i>0 && Math.random()<0.22){
    const e = makeEcho(now);
    if(e){ e.why = 'an echo from earlier'; session.cur = e; session.lanes.push(e.l); render(); return; }
  }
  let tries=0, enc=null, choice=null;
  while(tries<6 && !enc){
    choice = session.hold? {l:session.hold, why:session.holdWhy||'held for this session'} : chooseLane(now, avoid);
    enc = pickForLane(choice.l, now); tries++;
    if(session.hold && !enc) { session.hold=null; }
  }
  if(!enc){ enc = makeLangId(now); }
  else { enc.why = choice.why; session.lanes.push(enc.l); }
  session.cur = enc; render();
}
function makeLangId(now){
  const lanes = activeLanes().filter(l=>byLang[l].length); const l = lanes[Math.floor(Math.random()*lanes.length)];
  const sc = D.scenes[byLang[l][Math.floor(Math.random()*byLang[l].length)]];
  const opts = new Set([l]);
  const same = LANE_ORDER.filter(x=>x!==l && LANGS[x].t===LANGS[l].t).sort(()=>Math.random()-0.5);
  const rest = LANE_ORDER.filter(x=>x!==l && LANGS[x].t!==LANGS[l].t).sort(()=>Math.random()-0.5);
  for(const x of [...same, ...rest]){ if(opts.size>=4) break; opts.add(x); }
  return {type:'langid', l, sc, opts:[...opts].sort(()=>Math.random()-0.5)};
}

// ============================================================ scene rendering
function fitBubbleText(box, min){
  min = min || 8;
  let fs = parseFloat(box.style.fontSize)||16;
  let guard = 30;
  while(guard-- && fs>min && (box.scrollHeight > box.clientHeight+1 || box.scrollWidth > box.clientWidth+1)){ fs -= Math.max(0.4, fs*0.08); box.style.fontSize = fs+'px'; }
}
// Per-language balloon boxes. Episodes 1-12 give a real flowRegion; 13-23 are
// reconstructed from the line baselines. ~90% land inside the drawn balloon.
function rectFor(sc, l){ return (sc.q && sc.q[l]) || sc.r; }
function rectOK(r){ return !!r && r[2]>=0.045 && r[2]<=0.70 && r[3]>=0.010 && r[3]<=0.45; }
function pageOf(sc, lang){ return (byPage[sc.m]||[]).map(i=>D.scenes[i]).filter(s=>s.x[lang]); }
// Letter an entire comic page in one language: the page reads as the comic it is,
// and the line under study wears the halo. opts.mask hides the cloze answer.
function letterPage(box, cur, lang, opts){
  opts = opts || {};
  const here = pageOf(cur, lang);
  const items = [];
  here.forEach((s, i)=>{
    const r = rectFor(s, lang), isCur = s.i===cur.i;
    const pos = n=>{ n.style.left=(r[0]*100)+'%'; n.style.top=(r[1]*100)+'%'; n.style.width=(r[2]*100)+'%'; n.style.height=(r[3]*100)+'%'; };
    if(!rectOK(r)){
      if(isCur || opts.numbers){
        const cx=clamp((r[0]+r[2]/2)*100,2,98), cy=clamp((r[1]+r[3]/2)*100,2,98);
        box.append(opts.numbers ? bMark(cx, cy, String(i+1)) : bMark(cx, cy, null));
      }
      return;
    }
    if(isCur && !opts.noHalo){ const halo = el('div',{class:'bhalo'}); pos(halo); box.append(halo); }
    if(isCur && opts.mask===''){ return; }    // cloze word we could not blank: leave this balloon unlettered
    box.append(bPlate(r));
    const txt = lineOf(lang, (isCur && opts.mask) ? opts.mask : s.x[lang]);
    const bt = el('div',{class:'btext page'+(opts.onTap?' tap':'')+(isCur && opts.mask?' maskedline':''), dir:dirOf(lang), lang});
    if(isCur && opts.mask) bt.dataset.full = lineOf(lang, s.x[lang]);
    pos(bt); bt.textContent = txt;
    if(opts.onTap) bt.addEventListener('click', ()=>opts.onTap(s, i));
    box.append(bt);
    if(opts.numbers){
      const num = el('div',{class:'pagenum'}, String(i+1));
      num.style.left = clamp((r[0]-r[2]*0.04)*100, 1.2, 98.5)+'%'; num.style.top = clamp((r[1]-r[3]*0.10)*100, 1.2, 98.5)+'%';
      box.append(num);
    }
    items.push([bt, r, txt.length]);
  });
  const relayout = ()=>{
    const w = box.clientWidth, h = box.clientHeight;
    if(!w || !h) return;
    for(const [bt, r, len] of items){
      const fs = Math.sqrt(Math.max(50, r[2]*w*r[3]*h)/Math.max(6, len))*1.06;
      bt.style.fontSize = clamp(fs, 4.5, 26)+'px';
      fitBubbleText(bt, 4.5);
    }
  };
  requestAnimationFrame(relayout);
  const img = box.querySelector('img');
  if(img && !img.complete) img.addEventListener('load', ()=>requestAnimationFrame(relayout), {once:true});
  if(window.ResizeObserver && items.length){ const ro = new ResizeObserver(relayout); ro.observe(box); }
  return items.length;
}
function bPlate(r){
  const pl = el('div',{class:'bplate'});
  pl.style.left = ((r[0]-r[2]*0.09)*100)+'%'; pl.style.top = ((r[1]-r[3]*0.16)*100)+'%';
  pl.style.width = (r[2]*1.18*100)+'%'; pl.style.height = (r[3]*1.32*100)+'%';
  return pl;
}
function bMark(leftPct, topPct, label, mini){
  const m = el('div',{class:'bmark'+(mini?' mini':'')+(label?' num':'')});
  m.style.left = leftPct+'%'; m.style.top = topPct+'%';
  m.append(el('i',{}, label||null));
  return m;
}
function sceneBox(sc, lang, full, opts){
  opts = opts || {};
  const box = el('div',{class:'scene'+(full?' full':'')});
  const src = IMAGES[sc.m]; const [W,H] = SIZES[sc.m];
  const r0 = rectFor(sc, lang);
  const [rx,ry,rw,rh] = r0;
  const credible = rectOK(r0);
  if(full){
    box.append(el('img',{src, alt:'comic page'}));
    box._lettered = letterPage(box, sc, lang, {mask: opts.mask, onTap: opts.onTap});
    box._credible = credible;
    return box;
  }
  let ww = credible ? Math.max(W*0.5, rw*W*1.5) : W*0.55;
  let wh = ww*0.78;
  if(credible && wh < rh*H*1.35){ wh = Math.min(rh*H*1.35, H); ww = wh/0.78; }
  ww = Math.min(ww, W); wh = Math.min(wh, H);
  const cx = (rx+rw/2)*W, cy = (ry+rh/2)*H;
  const x0 = clamp(cx-ww/2, 0, W-ww), y0 = clamp(cy-wh/2, 0, H-wh);
  box.style.aspectRatio = `${ww}/${wh}`;
  box.style.backgroundImage = `url("${src}")`;
  box.style.backgroundSize = `${(W/ww)*100}% auto`;
  box.style.backgroundPosition = `${W-ww>0 ? (x0/(W-ww))*100 : 0}% ${H-wh>0 ? (y0/(H-wh))*100 : 0}%`;
  const bx = (rx*W-x0)/ww*100, by = (ry*H-y0)/wh*100, bw = rw*W/ww*100, bh = rh*H/wh*100;
  const mx = (cx-x0)/ww*100, my = (cy-y0)/wh*100;
  const vg = el('div',{class:'vignette'});
  vg.style.background = `radial-gradient(ellipse ${Math.max(bw*1.7,52)}% ${Math.max(bh*2.6,52)}% at ${mx}% ${my}%, rgba(0,0,0,0) 56%, rgba(8,10,16,.34) 100%)`;
  box.append(vg);
  let lettered = false;
  const maskEmpty = opts.mask==='';         // a cloze word we could not blank: safer to letter nothing
  if(credible && lang && sc.x[lang] && !maskEmpty){
    const pl = bPlate([bx/100, by/100, bw/100, bh/100]);
    box.append(pl);
    const bt = el('div',{class:'btext'+(opts.mask? ' maskedline':''), dir:dirOf(lang), lang});
    if(opts.mask) bt.dataset.full = lineOf(lang, sc.x[lang]);
    bt.style.left = bx+'%'; bt.style.top = by+'%'; bt.style.width = bw+'%'; bt.style.height = Math.min(bh, 96-by)+'%';
    bt.style.fontSize = clamp(Math.sqrt((rw*640)*(rh*H*(640/W))/Math.max(6,sc.x[lang].length))*1.05, 9, 26)+'px';
    bt.textContent = lineOf(lang, opts.mask != null ? opts.mask : sc.x[lang]);
    box.append(bt);
    lettered = true;
    requestAnimationFrame(()=>fitBubbleText(bt));
  }
  if(!lettered) box.append(bMark(mx, my, null, opts.mini));
  box._credible = credible;
  return box;
}
function tokenSpans(l, toks, opts){
  const cap = el('div',{class:'caption'+(LANGS[l].t==='cjk'?' cjk':''), dir:dirOf(l), lang:l});
  const now = Date.now();
  toks.forEach((t,idx)=>{
    const known = isKnown(l,t,now);
    const sp = el('span',{class:'tok'+(opts.gapIdx===idx?' gap':'')+(!known && opts.markUnknown && opts.gapIdx!==idx ? ' unk':''), 'data-i':idx});
    sp.append(el('span',{class:'t-s'}, opts.gapIdx===idx ? '____' : t[0]));
    const r = romOf(t);
    if(S.settings.readings && r && opts.gapIdx!==idx) sp.append(el('span',{class:'t-r'}, r));
    if(opts.onTap) sp.addEventListener('click', ()=>opts.onTap(idx, t, sp));
    cap.append(sp); if(LANGS[l].t!=='cjk' || l==='ko') cap.append(' ');
  });
  return cap;
}
function bridgeLine(l, t){
  const b = brOf(t); if(!b) return null;
  const parts = b.map(([v,w,k])=> `${v==='en'?'English':LANGS[v].n} <b>${esc(w)}</b>`);
  return el('div',{class:'bridge', html:'looks related to '+parts.join(' · ')+' <span class="small">(a guess from spelling — verify)</span>'});
}
function parallelBox(sc, l, showFamily){
  const box = el('div',{class:'parallel'});
  box.append(el('div',{}, el('span',{class:'l'},'en'), sc.x.en));
  if(showFamily){ for(const s of LANGS[l].sib){ if(sc.x[s] && S.lanes[s]!=='off') box.append(el('div',{dir:dirOf(s)}, el('span',{class:'l'}, s), sc.x[s])); } }
  return box;
}
function showHint(sp, l, t){
  document.querySelectorAll('.hint').forEach(h=>h.remove());
  const lm = lemmaOf(t); const c = S.cards[l][lm]; const now=Date.now();
  const h = el('div',{class:'hint'});
  const r = romOf(t);
  h.append(el('div',{}, el('b',{}, t[0]), r? ' · '+r : '', ' ', el('span',{class:'small mono'}, lm!==t[0].toLowerCase()? '→ '+lm : ''), ' ', el('span',{class:'small'}, `· ${bandLabel(t[2])}`)));
  if(c && c.s) h.append(el('div',{class:'small'}, `memory ${pct(cardR(c,now))} · holds ~${c.s.toFixed(1)} days · met ${c.reps}×`));
  const b = bridgeLine(l,t); if(b) h.append(b);
  sp.closest('#view').append(h);
  const rr = sp.getBoundingClientRect(), pr = h.parentElement.getBoundingClientRect();
  h.style.left = Math.max(0, Math.min(rr.left-pr.left, pr.width-260))+'px'; h.style.top = (rr.bottom-pr.top+6)+'px';
  setTimeout(()=>{ document.addEventListener('click', ()=>h.remove(), {once:true}); }, 0);
  setTimeout(()=>h.remove(), 5000);
}

// ============================================================ encounters
function renderEncounter(v){
  const e = session.cur; const now = Date.now();
  const bar = el('div',{class:'sessionbar'}); for(let i=0;i<session.n;i++) bar.append(el('i',{class:i<session.i?'done':(i===session.i?'now':'')})); v.append(bar);
  const head = e.type==='langid'
    ? el('div',{class:'row'}, el('span',{class:'chip warn'}, 'Which language is this?'), el('span',{class:'small grow', style:'text-align:right'}, 'a between-rounds game'))
    : el('div',{class:'row'}, laneDot(e.l), el('b',{}, LANGS[e.l].n), el('span',{class:'small'}, e.type==='cloze'?'· do you remember?':e.type==='echo'?'· an echo':(e.fluency?'· easy read':'· new bubble')), el('span',{class:'small grow', style:'text-align:right'}, e.why||''));
  v.append(head);
  if(e.type==='langid') return renderLangId(v, e);
  if(e.type==='echo') return renderEcho(v, e);
  const sc = e.sc;
  let full=false; const sceneWrap = el('div');
  // during a cloze the balloon keeps the gap too — lettering the full line would hand over the answer
  const maskNow = ()=>{
    if(e.type!=='cloze' || e._revealed) return null;
    const t = (sc.k[e.l]||[]).find(x=>lemmaOf(x)===e.lemma);
    if(!t) return '';
    const m = sc.x[e.l].replace(t[0], '____');
    return m===sc.x[e.l] ? '' : m;
  };
  const firstBox = sceneBox(sc, e.l, false, {mask: maskNow()}); sceneWrap.append(firstBox); v.append(sceneWrap);
  const hint = el('p',{class:'scenehint'});
  const setHint = ()=>{
    hint.textContent = full
      ? `The whole page, lettered in ${LANGS[e.l].n} — the glowing balloon is this line. Tap any balloon for its English.`
      : (firstBox._credible ? 'The line below is spoken in the marked balloon.'
                            : 'The marker shows roughly where this line sits — the translators\' file doesn\'t give this balloon\'s exact shape.');
  };
  const gloss = el('div',{class:'pagegloss'}); gloss.hidden = true;
  const showGloss = (s2)=>{
    gloss.hidden = false; gloss.innerHTML='';
    const tx = el('div',{class:'tx'});
    tx.append(el('div',{dir:dirOf(e.l), lang:e.l}, lineOf(e.l, s2.x[e.l])));
    if(s2.x.en) tx.append(el('span',{class:'en'}, s2.x.en));
    gloss.append(tx);
    if(canSpeak(e.l)) gloss.append(speakBtn(s2.x[e.l], e.l, true));
    speak(s2.x[e.l], e.l);
  };
  const toggle = el('button',{class:'quiet', onclick:()=>{
    full=!full; sceneWrap.innerHTML=''; gloss.hidden = true;
    sceneWrap.append(full ? sceneBox(sc, e.l, true, {mask: maskNow(), onTap: showGloss}) : sceneBox(sc, e.l, false));
    if(full) sceneWrap.append(gloss);
    toggle.textContent = full?'Back to the balloon':'See the whole page'; setHint();
  }}, 'See the whole page');
  v.append(toggle);
  setHint(); v.append(hint);
  const toks = sc.k[e.l];
  if(e.type==='cloze') return renderCloze(v, e, toks);
  const flips = new Map();
  const cap = tokenSpans(e.l, toks, {markUnknown:true, onTap:(idx,t,sp)=>{ const cur = flips.get(idx)||false; flips.set(idx, !cur); sp.classList.toggle('unk'); sp.classList.toggle('known', !sp.classList.contains('unk') && !isKnown(e.l,t,now)); speak(t[0], e.l); showHint(sp, e.l, t); }});
  const capRow = el('div',{class:'row'}, el('div',{class:'grow'}, cap));
  if(canSpeak(e.l)) capRow.append(speakBtn(sc.x[e.l], e.l, true));
  v.append(capRow);
  if(!S.coach.read && !e.fluency){ v.append(el('div',{class:'coach'}, 'First one: the highlighted words are probably new to you. Tap any word to hear it and see where it comes from — tapping also flips it between "new to me" and "I know this". Then be honest with the two buttons below.')); }
  else v.append(el('p',{class:'small'}, e.fluency
    ? 'You should know everything here — enjoy the read. Tap anything that\'s actually unfamiliar.'
    : (thr(e.l)>=9 && !S.tests[e.l]
        ? `Everything looks new because ${LANGS[e.l].n} is untested — a three-minute test in You fixes that.`
        : `${e.st.unk.length} word${e.st.unk.length===1?'':'s'} here ${e.st.unk.length===1?'is':'are'} probably new; the rest you know (${pct(e.st.cov)} of the bubble).`)));
  const par = el('div');
  v.append(el('button',{class:'quiet', onclick:()=>{ par.innerHTML=''; par.append(parallelBox(sc, e.l, false)); }}, 'Show the English'));
  v.append(par);
  const finish = (understood)=>{
    S.coach.read = true;
    const t0 = Date.now(); let unknownNow=[], knownNow=[]; let rewardNum=0, rewardDen=0;
    toks.forEach((t,idx)=>{ const modelKnown = isKnown(e.l,t,now); const flipped = flips.get(idx)||false; const userUnknown = modelKnown ? flipped : !flipped; const lm=lemmaOf(t);
      if(userUnknown) unknownNow.push(lm); else knownNow.push(lm);
      if(modelKnown){ rewardDen++; if(!userUnknown) rewardNum++; } });
    unknownNow = [...new Set(unknownNow)]; knownNow=[...new Set(knownNow)];
    let introduced=0;
    for(const lm of unknownNow){ const isNew = !S.cards[e.l][lm]; if(isNew){ if(introduced>=3) continue; introduced++; S.newToday[e.l]++; session.newWords++; } const c = S.cards[e.l][lm] || {}; S.cards[e.l][lm]=c; rate(c,1,t0); }
    for(const lm of knownNow){ const c = S.cards[e.l][lm];
      if(c && !c.prov && c.due<=t0) rate(c, understood?3:2, t0);
      else if(!c && !e.fluency){ const t = toks.find(x=>lemmaOf(x)===lm); if(t && t[2] < thr(e.l)) S.cards[e.l][lm] = {prov:true, s:0, d:0, due:t0+30*DAY, last:t0, reps:0, lapses:0, g:3}; } }
    reward(e.l, understood ? (rewardDen? rewardNum/rewardDen : 1) : 0);
    S.seen[sc.i]=t0; S.lastScene = S.lastScene||{}; S.lastScene[e.l]=sc.i;
    S.log.push({t:t0, l:e.l, type:'read', sc:sc.i, unk:unknownNow.length, ok:understood?1:0}); if(S.log.length>6000) S.log.splice(0, S.log.length-6000);
    if(understood) session.correct++;
    save(); session.i++; nextEncounter();
  };
  v.append(el('div',{class:'actions'}, el('button',{onclick:()=>finish(false)}, 'Too hard'), el('button',{class:'primary', onclick:()=>finish(true)}, 'Understood')));
}
function renderCloze(v, e, toks){
  const sc = e.sc; const lm = e.lemma;
  const idx = toks.findIndex(t=>lemmaOf(t)===lm); const target = toks[idx];
  const cap = tokenSpans(e.l, toks, {gapIdx:idx, markUnknown:false, onTap:(i,t,sp)=>{ if(i!==idx){ speak(t[0], e.l); showHint(sp,e.l,t); } }});
  v.append(cap);
  const c0 = S.cards[e.l][lm];
  if(c0 && (c0.reps||0)<=1 && c0.first && (Date.now()-c0.first) < 45*60000){
    v.append(el('p',{class:'small'}, 'You met this one a few minutes ago — the first return comes fast on purpose, then the gaps stretch', cite(2), '.'));
  }
  if(!S.coach.cloze){ v.append(el('div',{class:'coach'}, 'A word you\'ve met is hidden. Answering from memory is what makes it stick', cite(3), ' — and one option may be its look-alike from a neighbouring language.')); S.coach.cloze=true; save(); }
  if(e.lowCov){ v.append(el('p',{class:'small'}, 'This is the only bubble with that word, and it\'s a hard one — the English is open below.')); v.append(parallelBox(sc, e.l, false)); }
  const correct = target[0];
  const distract = [];
  const sib = (brOf(target)||[]).find(([vv])=> LANGS[e.l].sib.includes(vv));
  if(sib && sib[1].toLowerCase()!==correct.toLowerCase()) distract.push({w:sib[1], sib:sib[0]});
  const pool = lexArr[e.l].filter(x=> x[0]!==lm && Math.abs(x[2]-target[2])<1.2 && Math.abs((x[3]||x[0]).length-correct.length)<=2 && (x[3]||x[0]).toLowerCase()!==correct.toLowerCase());
  while(distract.length<2 && pool.length){ const x = pool.splice(Math.floor(Math.random()*pool.length),1)[0]; const w = x[3]||x[0]; if(!distract.find(d=>d.w.toLowerCase()===w.toLowerCase())) distract.push({w, sib:null, r:x[4]||''}); }
  const opts = [{w:correct, right:true, r:romOf(target)||''}, ...distract].sort(()=>Math.random()-0.5);
  const ch = el('div',{class:'choices'}); let answered=false; const t0 = Date.now();
  const after = el('div');
  for(const o of opts){
    const b = el('button',{dir:dirOf(e.l), lang:e.l, onclick:()=>{
      if(answered) return; answered=true; const ms = Date.now()-t0;
      const ok = !!o.right; b.classList.add(ok?'right':'wrong');
      if(!ok){ [...ch.children].forEach(x=>{ if(x.dataset.w===correct) x.classList.add('right'); }); if(o.sib){ S.inter[e.l][o.sib]=(S.inter[e.l][o.sib]||0)+1; } }
      const c = S.cards[e.l][lm] || {}; S.cards[e.l][lm]=c; rate(c, ok ? (ms<2500 && c.reps>=2 ? 4 : 3) : 1, Date.now());
      reward(e.l, ok?1:0); if(ok) session.correct++;
      const gap = cap.querySelector('.gap'); gap.textContent = correct; gap.classList.add(ok?'hit':'miss'); e._revealed = true;
      document.querySelectorAll('.btext.maskedline').forEach(b=>{ if(b.dataset.full){ b.textContent = b.dataset.full; fitBubbleText(b, 4.5); } });
      speak(sc.x[e.l], e.l);
      S.seen[sc.i]=Date.now(); S.log.push({t:Date.now(), l:e.l, type:'cloze', sc:sc.i, lm, ok:ok?1:0, ms, sib:o.sib||null}); if(S.log.length>6000) S.log.splice(0,S.log.length-6000);
      after.append(parallelBox(sc, e.l, (c.reps||0)>=2));
      const br = bridgeLine(e.l, target);
      if(br){ after.append(br); const rr = el('div',{class:'row small'}, 'Did one of these help you remember? ');
        for(const [vv,w] of (brOf(target)||[])){ rr.append(el('button',{class:'quiet', onclick:(ev)=>{ S.routes[e.l][vv]=(S.routes[e.l][vv]||0)+1; save(); ev.target.textContent='✓ '+(vv==='en'?'English':LANGS[vv].n); }}, vv==='en'?'English':LANGS[vv].n)); }
        after.append(rr); }
      after.append(el('div',{class:'small'}, ok ? `Held. It returns in about ${Math.max(1,Math.round((c.due-Date.now())/DAY))} day${Math.round((c.due-Date.now())/DAY)===1?'':'s'}.` : 'No harm — it comes straight back in ten minutes.'));
      after.append(el('div',{class:'actions'}, el('button',{class:'primary', onclick:()=>{ save(); session.i++; nextEncounter(); }}, 'Next')));
      save();
    }, 'data-w':o.w});
    b.append(el('span',{}, o.w));
    if(S.settings.readings && o.r) b.append(el('span',{class:'t-r'}, o.r));
    ch.append(b);
  }
  v.append(ch); v.append(after);
}
function renderEcho(v, e){
  const sc = e.sc;
  const eb = sceneBox(sc, e.l, false); v.append(eb);
  v.append(el('p',{class:'scenehint'}, eb._credible ? 'The line below is spoken in the marked balloon.' : 'The marker shows roughly where this line sits on the page.'));
  const idx = sc.k[e.l].findIndex(t=>lemmaOf(t)===e.lemma);
  const cap = tokenSpans(e.l, sc.k[e.l], {markUnknown:false, onTap:(i,t,sp)=>{ if(i!==idx){ speak(t[0], e.l); showHint(sp,e.l,t); } }});
  const gapEl = cap.children[idx]; if(gapEl) gapEl.classList.add('hit');
  v.append(cap);
  v.append(el('p',{class:'small'}, 'A bubble you\'ve never studied — but the highlighted word has crossed your path before. How does it land?'));
  const ch = el('div',{class:'choices echoq'}); const after = el('div'); let done=false;
  const answer = (g, label)=>{
    if(done) return; done=true;
    const c = S.cards[e.l][e.lemma]; const days = c? Math.max(1, Math.round((Date.now()-((c.first)||c.last))/DAY)) : null;
    rate(c, g, Date.now());
    reward(e.l, g>=3?1:(g===2?0.5:0));
    if(g>=3) session.correct++;
    S.seen[sc.i]=Date.now();
    S.log.push({t:Date.now(), l:e.l, type:'echo', lm:e.lemma, ok:g>=3?1:0, g});
    speak(sc.x[e.l], e.l);
    const et = D.etym && D.etym[e.l] && D.etym[e.l][e.lemma];
    after.append(parallelBox(sc, e.l, false));
    const met = S.log.find(x=>x.type!=='echo' && x.lm===e.lemma && x.l===e.l);
    after.append(el('div',{class:'small'},
      `${surfaceOf(e.l, e.lemma)}${readingOf(e.l,e.lemma)? ' ('+readingOf(e.l,e.lemma)+')':''} — you met it ${days? days+' day'+(days===1?'':'s')+' ago':'earlier'}${et&&et.o? ' · '+(et.ot==='bor'?'borrowed from ':'grew from ')+et.o:''}. That feeling of almost-knowing is real memory — glimpsed words are relearned faster than new ones`, cite(14,15,35), '.'));
    after.append(el('div',{class:'actions'}, el('button',{class:'primary', onclick:()=>{ save(); session.i++; nextEncounter(); }}, 'Next')));
    save();
  };
  ch.append(el('button',{onclick:()=>answer(3)}, 'I know it'));
  ch.append(el('button',{onclick:()=>answer(2)}, 'Familiar, can\'t place it'));
  ch.append(el('button',{onclick:()=>answer(1)}, 'New to me'));
  v.append(ch); v.append(after);
}
function renderLangId(v, e){
  const sc = e.sc;
  const card = el('div',{class:'card'});
  card.append(el('div',{class:'caption'+(LANGS[e.l].t==='cjk'?' cjk':''), dir:dirOf(e.l), style:'margin-top:0'}, sc.x[e.l]));
  v.append(card);
  const ch = el('div',{class:'choices'}); let done=false; const after = el('div');
  for(const o of e.opts){ const b = el('button',{onclick:()=>{ if(done) return; done=true; const ok = o===e.l; b.classList.add(ok?'right':'wrong'); if(!ok) [...ch.children].forEach(x=>{ if(x.dataset.l===e.l) x.classList.add('right'); });
    S.log.push({t:Date.now(), l:e.l, type:'langid', ok:ok?1:0, guess:o}); if(ok) session.correct++;
    speak(sc.x[e.l], e.l);
    after.append(parallelBox(sc, e.l, false));
    after.append(el('div',{class:'actions'}, el('button',{class:'primary', onclick:()=>{ save(); session.i++; nextEncounter(); }}, 'Next'))); save(); }, 'data-l':o}, laneDot(o), ' '+LANGS[o].n); ch.append(b); }
  v.append(ch); v.append(after);
  const note = el('div',{class:'card', style:'margin-top:14px'});
  note.append(el('div',{class:'eyebrow'}, 'Why this game is here'));
  note.append(el('p',{class:'small'}, 'Skirgård, Roberts and Yencken analysed nearly 15 million guesses across the 78 languages of The Great Language Game and found that a language is confused with its ', el('em',{},'geographic'), ' neighbours more often than with its genealogical relatives', cite(33), ' — so naming a language by its shapes teaches the map, not only the family tree. In a study of GeoGuessr play, written signs were the largest single category of cues people used to place an unfamiliar scene', cite(34), '.'));
  note.append(el('p',{class:'small', style:'margin:0'}, 'Full citations in ', el('a',{role:'link', tabindex:'0', onclick:()=>{ S.view='colophon'; save(); render(); }}, 'Evidence & credits'), '.'));
  v.append(note);
}
function renderSummary(v){
  const s = S.lastSession || {};
  v.append(el('h2',{}, 'That\'s one dip.'));
  const st = el('div',{class:'stat'});
  st.append(el('div',{}, el('b',{}, `${s.correct||0}/${s.n||0}`), el('span',{},'understood or recalled')));
  st.append(el('div',{}, el('b',{}, String(s.newWords||0)), el('span',{},'new words met')));
  st.append(el('div',{}, el('b',{}, String(new Set(s.lanes||[]).size)), el('span',{},'languages visited')));
  v.append(st);
  v.append(el('p',{class:'small'}, 'Clavis noted where you\'re improving', cite(10), ' — Paths shows every branch now open, and you can take the next one yourself.'));
  v.append(el('div',{class:'actions'}, el('button',{onclick:()=>{ session=null; S.view='paths'; save(); render(); }}, 'See the paths'), el('button',{class:'primary', onclick:()=>{ session=null; startSession(); }}, 'Another'), el('button',{onclick:()=>{ session=null; save(); render(); }}, 'Done')));
}

<script>
// ============================================================ letters & sounds
const HIRA = [['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko'],['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so'],['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to'],['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no'],['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho'],['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo'],['や','ya'],['',''],['ゆ','yu'],['',''],['よ','yo'],['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro'],['わ','wa'],['',''],['を','o'],['',''],['ん','n']];
const KATA2 = [['ア','a'],['イ','i'],['ウ','u'],['エ','e'],['オ','o'],['カ','ka'],['キ','ki'],['ク','ku'],['ケ','ke'],['コ','ko'],['サ','sa'],['シ','shi'],['ス','su'],['セ','se'],['ソ','so'],['タ','ta'],['チ','chi'],['ツ','tsu'],['テ','te'],['ト','to'],['ナ','na'],['ニ','ni'],['ヌ','nu'],['ネ','ne'],['ノ','no'],['ハ','ha'],['ヒ','hi'],['フ','fu'],['ヘ','he'],['ホ','ho'],['マ','ma'],['ミ','mi'],['ム','mu'],['メ','me'],['モ','mo'],['ヤ','ya'],['',''],['ユ','yu'],['',''],['ヨ','yo'],['ラ','ra'],['リ','ri'],['ル','ru'],['レ','re'],['ロ','ro'],['ワ','wa'],['',''],['ヲ','o'],['',''],['ン','n']];
const JAMO_C = [['ㄱ','g','가'],['ㄴ','n','나'],['ㄷ','d','다'],['ㄹ','r/l','라'],['ㅁ','m','마'],['ㅂ','b','바'],['ㅅ','s','사'],['ㅇ','(ng)','아'],['ㅈ','j','자'],['ㅊ','ch','차'],['ㅋ','k','카'],['ㅌ','t','타'],['ㅍ','p','파'],['ㅎ','h','하']];
const JAMO_V = [['ㅏ','a','아'],['ㅑ','ya','야'],['ㅓ','eo','어'],['ㅕ','yeo','여'],['ㅗ','o','오'],['ㅛ','yo','요'],['ㅜ','u','우'],['ㅠ','yu','유'],['ㅡ','eu','으'],['ㅣ','i','이']];
const TONES = [['妈','mā','high and flat'],['麻','má','rising, like a question'],['马','mǎ','dips then rises'],['骂','mà','falls sharply']];
const ABJAD = [['ا','alif','a/ā'],['ب','bā','b'],['ت','tā','t'],['ث','thā','th'],['ج','jīm','j'],['ح','ḥā','ḥ'],['خ','khā','kh'],['د','dāl','d'],['ذ','dhāl','dh'],['ر','rā','r'],['ز','zāy','z'],['س','sīn','s'],['ش','shīn','sh'],['ص','ṣād','ṣ'],['ض','ḍād','ḍ'],['ط','ṭā','ṭ'],['ظ','ẓā','ẓ'],['ع','ʿayn','ʿ'],['غ','ghayn','gh'],['ف','fā','f'],['ق','qāf','q'],['ك','kāf','k'],['ل','lām','l'],['م','mīm','m'],['ن','nūn','n'],['ه','hā','h'],['و','wāw','w/ū'],['ي','yā','y/ī']];
function kanaCell(glyph, sound, l, sub){
  if(!glyph) return el('div',{});
  const k = el('div',{class:'kana'+(glyph.length>1?' wide':''), role:'button', tabindex:'0', onclick:()=>{ if(!speak(glyph, l)) toast('No '+LANGS[l].n+' voice on this device'); }, onkeydown:e=>{ if(e.key==='Enter') speak(glyph,l); }});
  k.append(el('b',{lang:l}, glyph)); k.append(el('span',{}, sound)); if(sub) k.append(el('span',{}, sub));
  return k;
}
function renderLetters(v){
  S.letterTab = S.letterTab || 'ja';
  v.append(el('h2',{}, 'Letters and their sounds'));
  v.append(el('p',{class:'small'}, 'Tap anything to hear it (uses your device\'s voices). Readings also appear under every word in sessions — turn that off in Settings once a script feels like home.'));
  const tabs = el('div',{class:'scripttabs'});
  for(const [id,lab] of [['ja','Japanese'],['ko','Korean'],['zh','Chinese'],['ar','Arabic']]){
    tabs.append(el('button',{class:S.letterTab===id?'on':'', onclick:()=>{ S.letterTab=id; save(); render(); }}, lab));
  }
  v.append(tabs);
  const c = el('div',{class:'card'});
  if(S.letterTab==='ja'){
    S.kanaSet = S.kanaSet||'hira';
    const seg = el('div',{class:'seg'},
      el('button',{class:S.kanaSet==='hira'?'on':'', onclick:()=>{S.kanaSet='hira'; save(); render();}},'Hiragana'),
      el('button',{class:S.kanaSet==='kata'?'on':'', onclick:()=>{S.kanaSet='kata'; save(); render();}},'Katakana'));
    c.append(el('div',{class:'row'}, seg, el('span',{class:'small grow'}, S.kanaSet==='hira'?'the native syllabary — one symbol, one syllable':'same sounds, used for loanwords — many from English')));
    const g = el('div',{class:'kana-grid'});
    for(const [k,r] of (S.kanaSet==='hira'?HIRA:KATA2)) g.append(kanaCell(k,r,'ja'));
    c.append(g);
    c.append(el('p',{class:'small'}, 'Two small marks voice a sound: か ka → が ga, は ha → ば ba (and ぱ pa with a circle). Small ゃゅょ blend: き ki + ゃ → きゃ kya. The third script, kanji, are Chinese characters — the Chinese tab is secretly also about Japanese.'));
  }
  if(S.letterTab==='ko'){
    c.append(el('p',{class:'small', html:'Hangul looks like characters but is an <b>alphabet folded into blocks</b>: 한 = ㅎ h + ㅏ a + ㄴ n. Learn 24 letters and you can sound out everything.'}));
    c.append(el('h3',{},'Consonants'));
    const g1 = el('div',{class:'kana-grid'}); for(const [j,r,ex] of JAMO_C) g1.append(kanaCell(ex, r, 'ko', j)); c.append(g1);
    c.append(el('h3',{},'Vowels'));
    const g2 = el('div',{class:'kana-grid'}); for(const [j,r,ex] of JAMO_V) g2.append(kanaCell(ex, r, 'ko', j)); c.append(g2);
    c.append(el('p',{class:'small'}, 'Each tile speaks the letter inside the syllable shown (ㄱ alone has no sound of its own). ㅇ is silent at the start of a block and "ng" at the end.'));
  }
  if(S.letterTab==='zh'){
    c.append(el('p',{class:'small', html:'Chinese has no alphabet — words are characters, and <b>pīnyīn</b> (the Latin reading under every word here) tells you the sound. The accent mark is the <b>tone</b>, and tone changes meaning:'}));
    const g = el('div',{class:'kana-grid', style:'grid-template-columns:repeat(4,1fr)'});
    for(const [h,p,d] of TONES) g.append(kanaCell(h, p, 'zh', d));
    c.append(g);
    c.append(el('p',{class:'small'}, 'All four are "ma" — mother, hemp, horse, to scold. Characters are built from reusable parts (氵 water appears in 河 river, 海 sea), and the same characters power Japanese kanji: learn one, get a discount on the other.'));
  }
  if(S.letterTab==='ar'){
    c.append(el('p',{class:'small', html:'Arabic reads <b>right to left</b>. Letters join like cursive, so shapes shift slightly with position. Short vowels usually aren\'t written — the readings under words show the consonant skeleton, and you supply vowels as you learn words.'}));
    const g = el('div',{class:'kana-grid', style:'grid-template-columns:repeat(4,1fr)'});
    for(const [ch,name,snd] of ABJAD) g.append(kanaCell(ch, snd, 'ar', name));
    c.append(g);
    c.append(el('p',{class:'small'}, 'The same script writes Urdu (with a few extra letters and a different pen style) — your Urdu is a head start here, and this alphabet is the bridge back to it.'));
  }
  v.append(c);
}

// ============================================================ paths
function unlockCount(l, learnedSet, now){
  let n = 0;
  for(const id of byLang[l]){
    const st = sceneStats(l, D.scenes[id], now);
    if(st.unk.length && st.unk.length<=learnedSet.size+1 && st.unk.every(t=>learnedSet.has(lemmaOf(t)))) n++;
  }
  return n;
}
function computeBranches(now){
  const cand = [];
  for(const l of activeLanes()){
    if(!byLang[l].length) continue;
    const sc = laneScore(l, now);
    if(!S.tests[l]){
      cand.push({l, kind:'test', score: sc.score + 0.35,
        title:`Take the ${LANGS[l].n} check`,
        why:'three minutes of yes/no, so words you already own don\'t arrive as new',
        then:`Clavis stops treating ${LANGS[l].n} as brand new`});
      continue;
    }
    const due = dueCards(l, now);
    if(due.length){
      cand.push({l, kind:'due', score: sc.score + 0.25, n: due.length,
        title:`Bring back ${due.length} ${LANGS[l].n} word${due.length===1?'':'s'}`,
        words: due.slice(0,3).map(([lm])=>({w: surfaceOf(l,lm), r: readingOf(l,lm)})),
        why: whyText(sc),
        then:'each one you recall settles for days, then weeks'});
      continue;
    }
    const enc = pickForLane(l, now);
    if(enc && enc.type==='read' && !enc.fluency){
      const learned = new Set(enc.st.unk.map(lemmaOf));
      const u = unlockCount(l, learned, now);
      cand.push({l, kind:'new', score: sc.score, sc: enc.sc,
        title:`Meet ${enc.st.unk.length} new ${LANGS[l].n} word${enc.st.unk.length===1?'':'s'}`,
        words: enc.st.unk.slice(0,3).map(t=>({w: t[0], r: romOf(t)||''})),
        why: whyText(sc),
        then: u ? `${u} more bubble${u===1?' becomes':'s become'} readable` : 'the next bubbles get easier'});
    }
  }
  cand.sort((a,b)=>b.score-a.score);
  // keep the fan varied: at most two of any one kind
  const out = [], seen = {};
  for(const b of cand){ seen[b.kind]=(seen[b.kind]||0); if(seen[b.kind]>=2) continue; seen[b.kind]++; out.push(b); if(out.length>=4) break; }
  const readLane = activeLanes().find(l=>byLang[l].length && S.tests[l]) || activeLanes().find(l=>byLang[l].length);
  if(readLane && out.length<5) out.push({l:readLane, kind:'read', score:0,
    title:`Read ${LANGS[readLane].n} freely`, why:'no grading, no clock — just the comic',
    then:'glimpsed words are relearned faster later', cites:[15,17]});
  if(activeLanes().length>=3 && out.length<5) out.push({l:null, kind:'game', score:0,
    title:'Which language is this?', why:'name a line by its shapes alone',
    then:'places scripts on the map, not just the family tree', cites:[33]});
  return out;
}
function takeBranch(b){
  S.pathLog = S.pathLog || [];
  S.pathLog.push({t:Date.now(), kind:b.kind, l:b.l||null, title:b.title});
  if(S.pathLog.length>12) S.pathLog.shift();
  if(b.kind==='test'){ save(); return startTest(b.l); }
  if(b.kind==='read'){ S.story = Object.assign({ep:null, pi:0}, S.story||{}, {lane:b.l}); S.view='story'; save(); return render(); }
  if(b.kind==='game'){ S.intent=null; save(); startSession(); session.cur = makeLangId(Date.now()); return render(); }
  S.intent = {l: b.l, sc: b.kind==='new' && b.sc ? b.sc.i : null}; save(); startSession();
}
function pathsMap(v, branches){
  const wrap = el('div',{class:'cosmos-wrap grainy'});
  const box = el('div',{class:'explore-box'}); wrap.append(box);
  const cap = el('div',{class:'wordcard'}); cap.hidden=true; wrap.append(cap);
  wrap.append(el('div',{class:'cosmos-hint'}, 'tap a branch to take that path · everything can be dragged'));
  v.append(wrap);
  const KC = {test:'#DCAA47', due:'#93A4F5', new:'#86C197', read:'#B0B6C6', game:'#E6907F'};
  const SUB = {test:'a check', due:'bring back', new:'new words', read:'free reading', game:'which language?'};
  const SURF = cssVar('--surface')||'#F4F1E6', INK = cssVar('--ink')||'#1A1B1F';
  const LBL = cssVar('--cosmos-label')||'#F7F4EA', LBLBG = cssVar('--cosmos-labelbg')||'rgba(18,18,15,.55)';
  const GHOSTLN = cssVar('--ink-3')||'#CFCCC2';
  const nodes = [{id:'root', data:{k:'root'}, style:{x:0, y:0, size:46, fill:SURF, zIndex:5, stroke:GHOSTLN, lineWidth:0.8,
    label:true, labelText:'you', labelPlacement:'center', labelFill:INK, labelFontSize:12.5, labelFontWeight:600, labelFontFamily:'Hind'}}];
  const edges = []; const groups = {};
  branches.forEach((b,i)=>{
    const a = (i/branches.length)*Math.PI*2 - Math.PI/2;
    const bid = 'b'+i;
    nodes.push({id:bid, data:{k:'branch', gi:i, bi:i}, style:{x:Math.cos(a)*130, y:Math.sin(a)*130, size:36, fill:KC[b.kind], zIndex:4, cursor:'pointer',
      label:true, labelText:(b.l? LANGS[b.l].n : 'A game')+'\n'+SUB[b.kind], labelFill:LBL, labelFontSize:11, labelFontWeight:600, labelFontFamily:'Hind',
      labelTextAlign:'center', labelBackground:true, labelBackgroundFill:LBLBG, labelBackgroundRadius:4, labelBackgroundPadding:[1,5]}});
    edges.push({id:'e-'+bid, source:'root', target:bid, style:{stroke:KC[b.kind], lineWidth:2, strokeOpacity:0.85}});
    groups[i] = [bid];
    const gn = b.kind==='new'? 3 : 2;
    for(let g=0; g<gn; g++){
      const gid = 'g'+i+'_'+g;
      nodes.push({id:gid, data:{k:'ghost', gi:i}, style:{x:Math.cos(a+(g-1)*0.35)*200, y:Math.sin(a+(g-1)*0.35)*200,
        size: 11+hash01(gid)*7, fill:KC[b.kind], fillOpacity:0.4, label:false, zIndex:1}});
      edges.push({id:'e-'+gid, source:bid, target:gid, style:{stroke:GHOSTLN, lineDash:[3,4], lineWidth:1, strokeOpacity:0.5}});
      groups[i].push(gid);
    }
  });
  const W3 = Math.min(innerWidth-28, 572);
  const H3 = Math.round(Math.min(W3, innerHeight*0.6));
  box.style.height = H3+'px';
  let graph = null, dead = false;
  (async ()=>{
    try{
      graph = new G6.Graph({
        container: box, width: box.clientWidth || W3, height: H3, animation: false, padding: 26,
        data: {nodes, edges},
        autoFit: 'view',
        layout: {type:'d3-force', link:{distance:110, strength:0.9}, manyBody:{strength:-460}, collide:{radius:40}},
        behaviors: [
          {type:'drag-element-force', key:'dragel'},
          {type:'zoom-canvas', key:'zoom'},
          {type:'drag-canvas', key:'pan'},
        ],
        plugins: Object.keys(groups).map(gi=>({type:'bubble-sets', key:'pbs-'+gi, members: groups[gi],
          fill: KC[branches[gi].kind], fillOpacity: 0.08, stroke: KC[branches[gi].kind], strokeOpacity: 0.5, lineWidth: 1.2})),
      });
      await graph.render();
      if(dead){ graph.destroy(); return; }
      box._graph = graph;
      graph.on('node:click', ev=>{
        const id = ev.target && ev.target.id; if(!id) return;
        const nd = graph.getNodeData(id); const d = nd && nd.data;
        if(!d || d.k!=='branch'){ cap.hidden = true; return; }
        const b = branches[d.bi];
        cap.hidden = false; cap.innerHTML = '';
        cap.append(el('div',{class:'w'}, b.title));
        cap.append(el('button',{class:'quiet close', 'aria-label':'Close', onclick:()=>{ cap.hidden=true; }}, '✕'));
        cap.append(el('div',{class:'o'}, b.why, ' · then · ', b.then));
        cap.append(el('div',{class:'rels'}, el('button',{class:'accent', onclick:()=>takeBranch(b)}, 'Walk this way')));
      });
      graph.on('canvas:click', ()=>{ cap.hidden = true; });
    }catch(err){ box.append(el('div',{class:'loading'}, 'The map could not start here: '+esc(err.message))); }
  })();
  const prevStop = cosmosStop;
  cosmosStop = ()=>{ dead = true; try{ if(graph) graph.destroy(); }catch(e){} graph=null; if(prevStop) prevStop(); };
}
function renderPaths(v){
  const now = Date.now();
  S.pathView = S.pathView || 'tree';
  v.append(el('p',{class:'small', style:'margin-top:6px'}, 'No fixed course. Each branch below is a real next step Clavis can take right now — with the actual words it would use, and what it opens up. Take one yourself, or let Clavis choose: it leans toward wherever your results are changing fastest', cite(10,11), '.'));
  const branches = computeBranches(now);
  const modes = el('div',{class:'row', style:'margin:8px 0 2px'});
  for(const [id,lab] of [['tree','As a tree'],['map','As a map']]){
    modes.append(el('button',{class:S.pathView===id?'primary':'', style:'padding:6px 12px;font-size:.82rem', onclick:()=>{ S.pathView=id; save(); render(); }}, lab));
  }
  if(S.pathLog && S.pathLog.length){
    const last = S.pathLog[S.pathLog.length-1];
    const trail = el('span',{class:'small grow', style:'text-align:right'}, 'last: '+last.title);
    modes.append(trail);
    if(S.intent) modes.append(el('button',{class:'quiet', title:'Undo that choice', onclick:()=>{ S.intent=null; S.pathLog.pop(); save(); render(); toast('Choice undone — the fan is open again'); }}, '↶ undo'));
  }
  v.append(modes);
  if(S.pathView==='map'){ pathsMap(v, branches); v.append(el('p',{class:'small'}, 'The same branches, drawn by force', cite(40), ': springs pull each choice away from the others, and a soft contour groups choices of the same kind', cite(39), '. Faint nodes beyond each branch are the paths that would open — not computed, just possible.')); }
  const tree = el('div',{class:'tree'+(S.pathView==='map'?' hidden':'')});
  tree.append(el('div',{class:'rootrow'}, el('div',{class:'rootdot'},'you'), el('div',{}, el('b',{},'Here, now'), el('div',{class:'small'}, branches.length+' ways forward'))));
  for(const b of branches){
    const wrap = el('div',{class:'branch'});
    const c = el('div',{class:'pathcard k-'+b.kind});
    const kindLabel = {test:'first, a check', due:'bring back', new:'something new', read:'free reading', game:'a game'}[b.kind];
    c.append(el('div',{class:'k'}, b.l? laneDot(b.l):null, b.l? LANGS[b.l].n+' · ':'', kindLabel));
    c.append(el('h3',{}, b.title));
    if(b.kind==='new' && b.sc){ const mini = el('div',{class:'mini'}); mini.append(sceneBox(b.sc, b.l, false, {mini:true})); c.append(mini); }
    if(b.words && b.words.length){
      const w = el('div',{class:'words', dir:dirOf(b.l)});
      for(const x of b.words){ const sp = el('span',{lang:b.l}, x.w); if(S.settings.readings && x.r) sp.append(el('i',{}, x.r)); w.append(sp); }
      c.append(w);
    }
    c.append(el('div',{class:'why'}, b.why));
    c.append(el('button',{class:'primary', onclick:()=>takeBranch(b)}, b.kind==='test'?'Take the check':b.kind==='read'?'Open the comic':b.kind==='game'?'Play a round':'Walk this way'));
    const then = el('div',{class:'thenrow'});
    const dots = el('div',{class:'thendots'}); dots.append(el('i',{}),el('i',{}),el('i',{})); then.append(dots);
    then.append(el('span',{}, 'then · '+b.then, b.cites? cite(...b.cites):null));
    c.append(then);
    wrap.append(c); tree.append(wrap);
  }
  const tail = el('div',{class:'branch tail'});
  const tc = el('div',{class:'tailcard'});
  tc.append(el('div',{class:'fuzz'}));
  tc.append(el('span',{}, 'and onward — the paths after these are not computed yet. They form from what you do next.'));
  tail.append(tc); tree.append(tail);
  v.append(tree);
  const card = el('div',{class:'card'});
  card.append(el('div',{class:'eyebrow'},'The longer view, per language'));
  for(const l of LANE_ORDER){
    if(S.lanes[l]==='off') continue;
    const sc = laneScore(l, now); const cov = corpusCoverage(l, now); const known = knownCount(l, now);
    const row2 = el('div',{class:'lane'});
    row2.append(el('div',{class:'name'}, laneDot(l), ' '+LANGS[l].n+' ', el('span',{class:'chip '+(S.lanes[l]==='prod'?'prod':'rec')}, S.lanes[l]==='prod'?'speak':'read')));
    row2.append(el('button',{class: S.pin===l?'primary':'', onclick:()=>{ S.pin = S.pin===l?null:l; save(); render(); }}, S.pin===l?'Pinned':'Pin'));
    const lpv = sc.lp==null ? 'still watching you' : (sc.lp>0.1? 'improving fast' : 'steady');
    row2.append(el('div',{class:'meta'}, `${lpv} · ${sc.due} ready · ${known} held · ${pct(cov)} readable · new today ${S.newToday[l]}/${S.settings.newPerDay} · assumes ${S.tests[l]? bandLabel(S.tests[l].thr) : 'nothing (untested)'}`));
    const inter = Object.entries(S.inter[l]).filter(([k,n])=>n>0).map(([k,n])=>`${LANGS[k].n} ×${n}`).join(', ');
    if(inter) row2.append(el('div',{class:'why'}, `look-alikes that fooled you: ${inter}`));
    const routes = Object.entries(S.routes[l]).filter(([k,n])=>n>0).map(([k,n])=>`${k==='en'?'English':LANGS[k].n} ×${n}`).join(', ');
    if(routes) row2.append(el('div',{class:'why'}, `bridges that helped: ${routes}`));
    card.append(row2);
  }
  v.append(card);
}

// ============================================================ you
function renderYou(v){
  const now = Date.now();
  v.append(el('h2',{}, 'Your record'));
  const total = S.log.filter(e=>e.type!=='test').length; const days = new Set(S.log.map(e=>new Date(e.t).toDateString())).size;
  const cl = S.log.filter(e=>e.type==='cloze'); const acc = cl.length? cl.filter(e=>e.ok).length/cl.length : 0;
  const st = el('div',{class:'stat'});
  st.append(el('div',{}, el('b',{}, String(total)), el('span',{},'encounters')));
  st.append(el('div',{}, el('b',{}, String(days)), el('span',{},'days you showed up')));
  st.append(el('div',{}, el('b',{}, cl.length? pct(acc):'—'), el('span',{},'recall when asked')));
  v.append(st);
  const wrap = el('div',{class:'tablewrap'}); const tb = el('table');
  tb.append(el('thead',{}, el('tr',{}, el('th',{},'Language'), el('th',{},'Assumes you know'), el('th',{class:'n'},'Held'), el('th',{class:'n'},'Ready'), el('th',{class:'n'},'Readable'), el('th',{class:'n'},'Recall'), el('th',{class:'n'},'Mix-ups'))));
  const body = el('tbody');
  for(const l of LANE_ORDER){ if(S.lanes[l]==='off') continue;
    const c = S.log.filter(e=>e.type==='cloze'&&e.l===l); const a = c.length? pct(c.filter(e=>e.ok).length/c.length):'—';
    const conf = Object.values(S.inter[l]).reduce((x,y)=>x+y,0);
    body.append(el('tr',{}, el('td',{}, laneDot(l),' '+LANGS[l].n), el('td',{}, S.tests[l]? bandLabel(S.tests[l].thr) : 'nothing — untested'), el('td',{class:'n'}, String(knownCount(l,now))), el('td',{class:'n'}, String(dueCards(l,now).length)), el('td',{class:'n'}, pct(corpusCoverage(l,now))), el('td',{class:'n'}, a), el('td',{class:'n'}, String(conf)))); }
  tb.append(body); wrap.append(tb); v.append(el('div',{class:'card'}, wrap));
  v.append(el('p',{class:'small'}, '"Readable" = share of that language\'s bubbles you could read unaided', cite(1), '. "Mix-ups" counts times a neighbouring language\'s look-alike fooled you', cite(9), ' — the interference your future self will thank you for measuring. Terms are defined in ', el('a',{role:'link', tabindex:'0', onclick:()=>{ S.view='colophon'; save(); render(); }}, 'Evidence & credits'), '.'));
  const cT = el('div',{class:'card'});
  cT.append(el('div',{class:'eyebrow'}, 'Baseline tests'));
  for(const l of LANE_ORDER){ if(S.lanes[l]==='off') continue; cT.append(el('div',{class:'row', style:'margin:6px 0'}, el('span',{class:'grow'}, laneDot(l), ' '+LANGS[l].n, ' ', el('span',{class:'small'}, S.tests[l]? '· knows '+bandLabel(S.tests[l].thr) : '· untested')), el('button',{onclick:()=>startTest(l)}, S.tests[l]?'Retake':'Take test'))); }
  v.append(cT);
  const c2 = el('div',{class:'card'});
  c2.append(el('div',{class:'eyebrow'}, 'Your data'));
  c2.append(el('p',{class:'small'}, 'Everything lives in this browser. Copy the text to back up or move devices; paste it back to restore.'));
  const ta = el('textarea',{'aria-label':'state JSON'}); c2.append(ta);
  c2.append(el('div',{class:'actions'},
    el('button',{onclick:()=>{ ta.value = JSON.stringify(S); ta.select(); try{ navigator.clipboard.writeText(ta.value); toast('Copied'); }catch(e){ toast('Select and copy'); } }}, 'Export'),
    el('button',{onclick:()=>{ try{ const s = JSON.parse(ta.value); if(!s.cards) throw 0; S = Object.assign(freshState(), s); S.settings = Object.assign(freshState().settings, s.settings||{}); save(); render(); toast('Restored'); }catch(e){ toast('That doesn\'t look like a Clavis backup'); } }}, 'Import')));
  v.append(c2);
}

// ============================================================ settings
function renderSettings(v){
  v.append(el('h2',{}, 'Settings'));
  const c = el('div',{class:'card'}); c.append(el('div',{class:'eyebrow'},'Languages')); for(const l of LANE_ORDER) c.append(laneRow(l)); v.append(c);
  const c2 = el('div',{class:'card'}); c2.append(el('div',{class:'eyebrow'},'Rhythm'));
  const mk = (label, key, min, max, step)=>{ const out = el('span',{class:'mono'}, String(S.settings[key]));
    const inp = el('input',{type:'range', min, max, step, value:S.settings[key], 'aria-label':label, oninput:e=>{ S.settings[key]=parseFloat(e.target.value); out.textContent=S.settings[key]; save(); }});
    return el('div',{class:'row'}, el('span',{class:'grow'}, label), inp, out); };
  c2.append(mk('How firmly words should stick (retention)', 'retention', 0.8, 0.95, 0.01));
  c2.append(mk('New words per language per day', 'newPerDay', 2, 30, 1));
  c2.append(mk('Encounters per session', 'sessionSize', 3, 10, 1));
  const tgl = (label, key, note)=> el('div',{class:'row', style:'margin-top:6px'}, el('span',{class:'grow'}, label, note? el('span',{class:'small'}, ' — '+note):null),
    el('button',{onclick:e=>{ S.settings[key]=!S.settings[key]; save(); render(); }}, S.settings[key]?'On':'Off'));
  c2.append(tgl('Readings under words', 'readings', 'rōmaji, pīnyīn, romanised Korean and Arabic'));
  c2.append(tgl('One language per session', 'monoSession', 'hold a single language instead of hopping'));
  c2.append(tgl('Motion', 'motion', 'the pool and the Cosmos hold still when off'));
  v.append(c2);
  const c4 = el('div',{class:'card'}); c4.append(el('div',{class:'eyebrow'},'About'));
  c4.append(el('p',{class:'small'}, 'Voices come from your device (on Android, install them under Text-to-speech settings). Add this page to your home screen to use it as an app. Everything stays on this device — there is no server. The evidence behind every design choice, the materials and their licences, and a glossary live in ', el('a',{role:'link', tabindex:'0', onclick:()=>{ S.view='colophon'; save(); render(); }}, 'Evidence & credits'), '.'));
  c4.append(el('div',{class:'actions'},
    el('button',{onclick:()=>{ S.view='colophon'; save(); render(); }}, 'Evidence & credits'),
    el('button',{onclick:()=>{ S.ob=0; S.onboarded=false; save(); render(); }}, 'Replay the intro'),
    el('button',{onclick:()=>{ if(confirm('Erase all local progress?')){ localStorage.removeItem(STORE_KEY); S = freshState(); render(); } }}, 'Reset everything')));
  v.append(c4);
}

// ============================================================ boot
async function boot(){
  try{
    const bin = Uint8Array.from(atob(DATA_B64), c=>c.charCodeAt(0));
    if(typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unpack the corpus (needs Chrome 80+, Firefox 113+, or Safari 16.4+).');
    const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    D = JSON.parse(await new Response(stream).text());
    indexCorpus();
    S = load();
    if(!NAV.find(d=>d.id===S.view) && !['set','colophon','story'].includes(S.view)) S.view='learn';
    session=null; T=null;
    render();
  }catch(err){ $('#view').innerHTML = '<p style="padding:40px 0">Could not load: '+esc(err.message)+'</p>'; }
}
boot();
</script>
