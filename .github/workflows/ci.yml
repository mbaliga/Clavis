name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, assemble debug APK, package desktop jar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: >
          ./gradlew
          :shared:allTests
          :composeApp:desktopTest
          :composeApp:assembleDebug
          :composeApp:packageUberJarForCurrentOS
          --no-daemon --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clavis-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload desktop uber-jar (linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clavis-desktop-jar-linux
          path: composeApp/build/compose/jars/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            composeApp/build/reports/tests/
