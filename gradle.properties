# --- JVM sizing -----------------------------------------------------------------------------
# Sized for a 4-CPU / 15 GB box that shares the machine with other work. A KMP + Compose build
# runs three JVMs (Gradle daemon, Kotlin daemon, R8/test workers); the split below keeps their
# combined peak under ~7 GB.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=2

# --- Gradle features ------------------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is deliberately OFF for now: with KGP 2.1.20 + CMP 1.8.2 the KMP task graph
# did not serialise cleanly here ("Configuration cache entry discarded due to serialization error"
# on :shared:compileKotlinDesktop), which made every run re-configure anyway and added noise to
# failures. Re-enable (true, or `org.gradle.configuration-cache.problems=warn` first) once a full
# `./gradlew :shared:allTests :composeApp:desktopTest :composeApp:assembleDebug` stores its entry.
org.gradle.configuration-cache=false

# --- Android --------------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ---------------------------------------------------------------------------------
kotlin.code.style=official

# --- Compose Multiplatform ------------------------------------------------------------------
# Quiet jpackage/proguard output from the desktop packaging tasks.
compose.desktop.verbose=false
