# Version matrix and the reasons behind it: docs/build-platform.md
[versions]
agp = "8.9.1"
kotlin = "2.1.20"
compose-multiplatform = "1.8.2"

android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

kotlinx-serialization = "1.8.1"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.6.2"
okio = "3.10.2"
androidx-activity-compose = "1.10.1"
# org.jetbrains.androidx.* are JetBrains' multiplatform builds of the AndroidX libraries; their
# versions track the Compose Multiplatform release they were validated against.
androidx-lifecycle = "2.9.1"
# beta03 is the navigation build released with CMP 1.8.2. beta04 was cut against CMP 1.9.0-beta01
# and drags org.jetbrains.compose.runtime / ui-backhandler 1.9.0-beta01 into a 1.8.2 build.
androidx-navigation = "2.9.0-beta03"
compose-material-icons = "1.7.3"
multiplatform-settings = "1.3.0"
junit = "4.13.2"
# Desktop audio decoders (pure Java, LGPL 2.1; THIRD_PARTY_NOTICES "Desktop audio"): Commons and
# Tatoeba recordings are MP3 (Commons serves transcoded .ogg.mp3), some Commons originals are OGG.
mp3spi = "1.9.5.4"
vorbisspi = "1.0.3.3"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
# material3 itself comes from the `compose.material3` accessor of the Compose Multiplatform
# plugin (version-locked to compose-multiplatform). Icons are published on their own cadence.
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
mp3spi = { module = "com.googlecode.soundlibs:mp3spi", version.ref = "mp3spi" }
vorbisspi = { module = "com.googlecode.soundlibs:vorbisspi", version.ref = "vorbisspi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
